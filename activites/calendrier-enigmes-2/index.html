<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calendrier des énigmes n°2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: joyeux, chaleureux, lisible au TBI par des CM2
   IDEA: un village de cadeaux enneigés au pied d'une piste de luge, une énigme derrière chaque porte
   PICTURE: nuit d'hiver, collines de neige, sapins, une luge qui descend ; neige qui tombe
   COLOUR and TYPE: bleu nuit dominant, neige blanche, rouge Noël en accent, vert sapin ; Mountains of Christmas + Fredoka
   LAYOUT: scène en haut, grille de 24 portes, chaque énigme s'ouvre en grande fiche papier */
:root{color-scheme:light dark;--night:#0c2240;--night2:#173a63;--snow:#f6faff;--red:#c8102e;--red2:#a30d25;--green:#17694a;--gold:#f2b632;--ink:#16213a;--paper:#fffdf7;--muted:#56627a;--ok:#1d8a4e;--ko:#c8102e}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-behavior:smooth}
body{margin:0;position:relative;background:radial-gradient(ellipse at 70% -10%,#3b2f7a 0%,transparent 55%),linear-gradient(#060e2a,#122a5c 460px,#1b3f78 900px,#20497f);color:var(--snow);font:19px/1.5 Fredoka,"Trebuchet MS",system-ui,sans-serif;overflow-x:clip;min-height:100vh}
#snow{position:fixed;inset:0;pointer-events:none;z-index:1}
header{position:relative;z-index:2;padding:22px max(4vw,14px) 0;max-width:1240px;margin:auto}
h1{font-family:"Mountains of Christmas",cursive;font-size:clamp(42px,6.5vw,72px);line-height:1.05;margin:4px 0 0;background:linear-gradient(180deg,#fffbe6,#f7d774 50%,#d99a1c);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 rgba(70,35,0,.45)) drop-shadow(0 0 20px rgba(255,214,120,.45));text-wrap:balance;cursor:default;user-select:none}
.sub{font-size:20px;margin:6px 0 0;color:#d6e6ff}
.scene{display:block;width:100vw;max-width:none;margin-left:calc(50% - 50vw);height:clamp(150px,24vw,300px);margin-top:-6px;-webkit-mask-image:linear-gradient(#000 78%,transparent);mask-image:linear-gradient(#000 78%,transparent)}
main{position:relative;z-index:2;max-width:1240px;margin:auto;padding:0 max(4vw,14px) 40px}
.doors{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:30px 18px;margin-top:14px}
.door{position:relative;aspect-ratio:1;border:0;border-radius:16px;cursor:pointer;font:inherit;color:#fff;padding:0;display:grid;place-items:center;
  background:linear-gradient(90deg,transparent calc(50% - 9px),#d9a22a calc(50% - 9px),#ffe9a3 50%,#d9a22a calc(50% + 9px),transparent calc(50% + 9px)),linear-gradient(0deg,transparent calc(50% - 9px),#d9a22a calc(50% - 9px),#ffe9a3 50%,#d9a22a calc(50% + 9px),transparent calc(50% + 9px)),radial-gradient(circle,rgba(255,255,255,.22) 2px,transparent 3px) 0 0/20px 20px,linear-gradient(145deg,var(--g1),var(--g2));
  box-shadow:0 8px 0 rgba(0,0,0,.28),0 16px 30px rgba(0,0,0,.35),inset 0 0 0 2px rgba(255,255,255,.14);transition:transform .2s}
.door:hover,.door:focus-visible{transform:translateY(-4px) rotate(-1.5deg)}
.door:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
.door::before{content:"";position:absolute;left:-4px;right:-4px;top:-9px;height:26px;z-index:1;background:radial-gradient(circle at 10% 70%,#fff 12px,transparent 13px),radial-gradient(circle at 30% 55%,#fff 15px,transparent 16px),radial-gradient(circle at 72% 60%,#fff 15px,transparent 16px),radial-gradient(circle at 92% 70%,#fff 12px,transparent 13px);filter:drop-shadow(0 2px 0 #c9d9ee)}
.door::after{content:"";position:absolute;inset:0;border-radius:16px;background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.55) 50%,transparent 62%) no-repeat;background-size:260% 100%;background-position:160% 0;transition:background-position .8s;pointer-events:none}
.door:hover::after{background-position:-60% 0}
.door .bow{position:absolute;z-index:2;top:-20px;left:50%;transform:translateX(-50%);width:60px;height:34px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
.door .num{position:relative;z-index:1;display:grid;place-items:center;width:58%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fffef8,#f1e6c8);border:3px solid #e2b13c;color:var(--g2);font-family:"Mountains of Christmas",cursive;font-size:44px;line-height:1;box-shadow:0 4px 12px rgba(0,0,0,.3),inset 0 0 0 3px #fffaf0}
.door .tag{position:absolute;z-index:1;left:6px;right:6px;bottom:7px;font-size:13px;line-height:1.2;background:rgba(255,255,255,.95);color:var(--ink);border-radius:8px;padding:3px 4px}
.door.locked{filter:saturate(.55) brightness(.82)}
.door.locked .num{color:#6f7d99;border-color:#c9d3e6}
.door.today{animation:glowd 1.6s ease-in-out infinite alternate}
@keyframes glowd{from{box-shadow:0 8px 0 rgba(0,0,0,.28),0 0 0 0 rgba(255,209,102,0)}to{box-shadow:0 8px 0 rgba(0,0,0,.28),0 0 34px 10px rgba(255,209,102,.8)}}
.door.solved .num::after{content:"★";position:absolute;right:-14px;top:-14px;color:#ffd166;font-size:32px;text-shadow:0 0 10px rgba(255,209,102,.95),0 2px 0 #9a6a00}
.c0{--g1:#e3344f;--g2:#9d0f26}.c1{--g1:#22a06b;--g2:#0f5a3b}.c2{--g1:#3a7bd5;--g2:#1a3f86}.c3{--g1:#9b59d0;--g2:#5b2a8c}
.aurora{position:absolute;left:0;right:0;top:0;height:560px;z-index:0;pointer-events:none;overflow:hidden}
.aurora i{position:absolute;width:70%;height:220px;border-radius:50%;filter:blur(48px);opacity:.42;animation:aur 14s ease-in-out infinite alternate}
.aurora i:nth-child(1){left:-12%;top:50px;background:linear-gradient(90deg,transparent,#3ee8b5,transparent)}
.aurora i:nth-child(2){left:28%;top:0;background:linear-gradient(90deg,transparent,#9a7bff,transparent);animation-duration:19s}
.aurora i:nth-child(3){left:52%;top:100px;background:linear-gradient(90deg,transparent,#41c7ff,transparent);animation-duration:23s}
.aurora svg{position:absolute;inset:0}
@keyframes aur{from{transform:translateX(-6%) skewY(-6deg) scaleY(.8)}to{transform:translateX(9%) skewY(5deg) scaleY(1.2)}}
.tw{animation:tw 2.6s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.25}to{opacity:1}}
.bulb{animation:bl 1.4s ease-in-out infinite alternate}
@keyframes bl{from{opacity:.35}to{opacity:1}}
.garland{position:relative;z-index:2;display:block;width:100%;height:56px;margin-bottom:-8px}
.legend{margin:30px 0 0;color:#d6e6ff;font-size:16px}
.legend b{color:#fff}
footer{position:relative;z-index:2;text-align:center;color:#b8cbe6;font-size:14px;padding:10px 16px 30px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(140%);background:var(--paper);color:var(--ink);padding:14px 22px;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.35);z-index:50;transition:transform .3s;font-size:19px;max-width:92vw;text-align:center}
#toast.on{transform:translateX(-50%) translateY(0)}
/* fiche du jour */
#day{position:fixed;inset:0;z-index:20;overflow-y:auto;background:radial-gradient(ellipse at 50% 0,rgba(60,50,130,.6),rgba(4,12,30,.85));backdrop-filter:blur(5px);display:none;padding:18px max(3vw,10px) 40px}
#day.on{display:block}
.card{max-width:1000px;margin:24px auto 0;background:var(--paper);color:var(--ink);border-radius:22px;padding:clamp(18px,3vw,34px);box-shadow:0 0 0 4px #f2c94c,0 0 0 8px rgba(242,201,76,.25),0 20px 60px rgba(0,0,0,.5);position:relative}
.card::before{content:"";position:absolute;left:14px;right:14px;top:-16px;height:28px;background:radial-gradient(circle at 50% 100%,#fff 17px,transparent 18px) 0 0/40px 28px repeat-x;filter:drop-shadow(0 -1px 0 #dce7f5)}
.top{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.back{border:0;background:var(--night2);color:#fff;font:inherit;font-size:18px;border-radius:12px;padding:10px 16px;cursor:pointer;min-height:44px}
.date{font-family:"Mountains of Christmas",cursive;font-size:clamp(34px,5vw,48px);line-height:1;color:var(--red)}
.fam{display:inline-block;border-radius:999px;padding:6px 14px;font-weight:600;font-size:17px;color:#fff}
h2{font-size:clamp(26px,3.4vw,34px);margin:14px 0 4px;line-height:1.15}
.src{color:var(--muted);font-size:15px;margin:0 0 10px}
.methode{border-radius:14px;padding:12px 16px;margin:12px 0 16px;font-size:18px;border:2px dashed}
.enonce{font-size:20px;background:#fff;border:2px solid #e5e9f2;border-radius:14px;padding:14px 18px}
.enonce p{margin:.3em 0}
.zone{margin:18px 0;padding:16px;border-radius:16px;background:#eef5ff;border:2px solid #d3e3fb}
.zone h3{margin:0 0 8px;font-size:19px;color:var(--night2)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{border:0;font:inherit;font-size:18px;border-radius:12px;padding:10px 16px;cursor:pointer;min-height:46px;background:var(--night2);color:#fff}
.btn.red{background:var(--red)}.btn.green{background:var(--green)}.btn.light{background:#dde7f6;color:var(--ink)}.btn.gold{background:var(--gold);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.tok:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.answer{margin-top:16px;padding:16px;border-radius:16px;background:#fff6e0;border:2px solid #f3d58d}
.field{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0}
.field input{font:inherit;font-size:20px;width:7.5em;padding:8px 10px;border:2px solid #b9c3d6;border-radius:10px;background:#fff;color:var(--ink)}
.field input.good{border-color:var(--ok);background:#e6f6ec}.field input.bad{border-color:var(--ko);background:#fde8eb}
.fb{margin-top:10px;font-size:19px;font-weight:500;min-height:1.5em}
.fb.ok{color:var(--ok)}.fb.ko{color:var(--ko)}
.hint,.corr{margin-top:14px;border-radius:14px;padding:12px 18px;font-size:18px}
.hint{background:#e8f7ef;border:2px solid #a8dcbf}
.corr{background:#f3efff;border:2px solid #cfc3f7}
.corr ol{margin:.3em 0;padding-left:1.3em}.corr li{margin:.3em 0}
.big{font-size:22px;font-weight:600}
/* jetons à placer */
.tray{display:flex;flex-wrap:wrap;gap:10px;min-height:58px;padding:8px;border-radius:12px;background:#fff;border:2px dashed #b9c9e3;margin-top:10px}
.tok{width:52px;height:52px;border-radius:12px;border:2px solid #7b8db0;background:#fff;color:var(--ink);font:inherit;font-size:24px;font-weight:600;cursor:grab;touch-action:none;display:grid;place-items:center;box-shadow:0 3px 0 #b9c3d6}
.tok.sel{background:var(--gold);border-color:#b8740d}
.tok.ghost{visibility:hidden}
.slot{width:56px;height:56px;border-radius:12px;border:3px dashed #7b8db0;background:#fff;display:grid;place-items:center;font-size:25px;font-weight:600;cursor:pointer;touch-action:none;color:var(--ink)}
.slot.full{border-style:solid;border-color:var(--night2);background:#fffbe9}
.slot.round{border-radius:50%}
.fixed{width:56px;height:56px;border-radius:12px;border:3px solid #444;background:#e9ecf2;display:grid;place-items:center;font-size:25px;font-weight:600;color:var(--ink)}
.fixed.round{border-radius:50%}
.drag-ghost{position:fixed;z-index:100;pointer-events:none;transform:translate(-50%,-50%) scale(1.1)}
.stage{position:relative;width:100%;margin:auto}
.stage>svg{position:absolute;inset:0;width:100%;height:100%}
.stage>.slot,.stage>.fixed,.stage>.lab{position:absolute;transform:translate(-50%,-50%)}
.lab{font-weight:600;font-size:18px;white-space:nowrap}
.chk{display:inline-block;min-width:1.4em;font-weight:700}
.chk.y{color:var(--ok)}.chk.n{color:var(--ko)}
table.logi{border-collapse:collapse;font-size:17px;background:#fff}
.logi th,.logi td{border:2px solid #9aa8c2;padding:6px;text-align:center}
.logi td button{width:54px;height:44px;border:0;background:#fff;font:inherit;font-size:22px;font-weight:700;cursor:pointer;color:var(--ink)}
.grid3{display:grid;grid-template-columns:repeat(3,92px);gap:0;border:3px solid #333;width:max-content;background:#fff}
.grid3 .c{width:92px;height:92px;border:1px solid #888;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:5px;padding:6px;cursor:pointer;background:#fff;font:inherit}
.grid3 .c.blk{background:#222;cursor:default}
.grid3 .c.given{background:#eef0f4;cursor:default}
.dot{width:20px;height:20px;border-radius:50%;border:2px solid #333;background:#fff}
.dot.n{background:#222}
.dot.t{background:#c7ccd6;border-color:#7a8191}
.bars{display:grid;grid-template-columns:5.5em 1fr;gap:8px 12px;align-items:center;margin:10px 0}
.bar{display:flex;gap:4px;height:40px}
.bar span{display:grid;place-items:center;border-radius:8px;color:#fff;font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden}
.pion{width:64px;height:64px;border-radius:50%;border:3px solid #555;background:#f4f6fa;font:inherit;font-size:26px;font-weight:700;cursor:pointer;color:var(--ink)}
.pion.off{opacity:.18}
.pion.lock{background:#ffe9a8;border-color:#b8740d;cursor:default}
.mini{display:inline-grid;grid-template-columns:repeat(3,18px);gap:2px;padding:4px;background:#fff;border:1px solid #ccc;border-radius:6px;margin:3px;font-size:11px;text-align:center}
.mini span{width:18px;height:18px;border-radius:50%;background:#c9ced8;line-height:18px}
.mini span.k{background:#fff;border:1px dashed #ccc}
.coll{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{background:#fff;border:2px solid #c8d4ea;border-radius:10px;padding:4px 10px;font-size:18px}
.maze{display:grid;grid-template-columns:repeat(4,74px);gap:6px;width:max-content}
.room{width:74px;height:74px;border-radius:10px;border:2px solid #8aa0c4;background:#fff;font:inherit;font-size:24px;font-weight:600;cursor:pointer;color:var(--ink)}
.room.here{background:var(--gold);border-color:#b8740d}
.room.seen{background:#d8ecdf}
.room.alarm{background:#ffb3bd;animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.notes{display:flex;gap:8px}
.sticks{display:grid;gap:12px;justify-items:center;margin:10px 0}
.srow{display:flex;gap:10px;align-items:center}
.stick{width:16px;height:64px;border-radius:8px;border:0;background:#8b5a2b;cursor:pointer;padding:0}
.stick.sel{background:var(--red);transform:translateY(-6px)}
.stick.gone{visibility:hidden}
.flowers{display:grid;gap:4px;justify-items:center;margin:8px 0}
.frow{display:flex;gap:2px;align-items:center}
.frow small{width:6.5em;text-align:right;color:var(--muted);font-size:14px;margin-right:6px}
@media (max-width:600px){body{font-size:17px}.doors{grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:24px 12px}.door .num{font-size:30px}.door .bow{width:46px;top:-16px}.door .tag{font-size:11px}.grid3{grid-template-columns:repeat(3,78px)}.grid3 .c{width:78px;height:78px}.maze{grid-template-columns:repeat(4,62px)}.room{width:62px;height:62px}.enonce{font-size:18px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<script>
{
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const el=html=>{const t=document.createElement('template');t.innerHTML=html.trim();return t.content.firstElementChild};
const num=s=>{const m=String(s).replace(/\s/g,'').match(/-?\d+/);return m?+m[0]:NaN};
const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]/g,'');

/* ---------- mémoire ---------- */

/* ---------- familles de raisonnement ---------- */
const FAM={
 bal:{nom:'La balance',col:'#2f6db5',m:"Si on enlève (ou si on remplace) la même chose des deux côtés d'une balance, elle reste en équilibre."},
 plac:{nom:'Les nombres à placer',col:'#c8102e',m:"Commence par l'endroit où il y a le moins de choix : un triangle, un cercle ou un groupe presque complet. Puis complète par différence."},
 enq:{nom:"L'enquête",col:'#6b4fa0',m:"Pars de l'indice le plus sûr, puis élimine ce qui est impossible. Un tableau « oui / non » aide à ne rien oublier."},
 gril:{nom:'Les grilles à indices',col:'#17694a',m:"Cherche d'abord la rangée où il n'y a qu'une seule possibilité. Chaque case trouvée t'aide pour la suivante."},
 parts:{nom:'Les parts',col:'#e07a1f',m:"Dessine des barres : une barre = une part. Repère ce qui ne change pas, puis partage le total en parts égales."},
 code:{nom:'Les opérations codées',col:'#a30d25',m:"Commence par la colonne qui donne une information sûre (souvent celle de gauche ou celle des unités) et pense aux retenues."},
 liste:{nom:'Compter sans oublier',col:'#1f8a8a',m:"Range tes essais dans un ordre précis : comme ça, tu n'en oublies aucun et tu ne comptes pas deux fois le même."},
 dates:{nom:'Les dates',col:'#7a5a2a',m:"Place d'abord ce qui est obligatoire (l'année), puis cherche quels mois et quels jours restent possibles avec les chiffres qui restent."},
 chem:{nom:'Les chemins',col:'#3d7a2a',m:"Suis la règle pas à pas, sans revenir en arrière. Si tu bloques, pars de la sortie et remonte."},
 motif:{nom:'Ce qui grandit',col:'#b8740d',m:"Observe ce qui change d'une étape à l'autre : ajoute-t-on toujours la même quantité ?"},

};

/* ---------- jetons à déplacer (toucher puis toucher, ou glisser) ---------- */
function tokens(wrap,list,onChange){
  const st={sel:null,at:{}};const tray=$('.tray',wrap);const slots=$$('[data-slot]',wrap);
  const used=i=>Object.values(st.at).includes(i);
  const values=()=>{const v={};slots.forEach(s=>{const i=st.at[s.dataset.slot];v[s.dataset.slot]=i==null?null:list[i]});return v};
  function render(){
    tray.innerHTML=list.map((t,i)=>used(i)?`<span class="tok ghost">${t}</span>`:`<button class="tok ${st.sel===i?'sel':''}" data-i="${i}" aria-label="jeton ${t}">${t}</button>`).join('');
    slots.forEach(s=>{const i=st.at[s.dataset.slot];s.textContent=i==null?'':list[i];s.classList.toggle('full',i!=null)});
    onChange&&onChange(values());
  }
  function place(slot,i){for(const k in st.at)if(st.at[k]===i)delete st.at[k];st.at[slot]=i;st.sel=null;render()}
  let drag=null,skip=false;
  wrap.addEventListener('pointerdown',e=>{
    const t=e.target.closest('.tok[data-i]'),s=e.target.closest('[data-slot]');
    if(t)drag={i:+t.dataset.i,from:null,x:e.clientX,y:e.clientY,moved:false};
    else if(s&&st.at[s.dataset.slot]!=null)drag={i:st.at[s.dataset.slot],from:s.dataset.slot,x:e.clientX,y:e.clientY,moved:false};
  });
  const mv=e=>{if(!drag)return;
    if(!drag.moved&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>8){drag.moved=true;drag.g=el(`<div class="tok sel drag-ghost">${list[drag.i]}</div>`);document.body.append(drag.g)}
    if(drag.moved){drag.g.style.left=e.clientX+'px';drag.g.style.top=e.clientY+'px';e.preventDefault()}};
  const up=e=>{if(!drag)return;
    if(drag.moved){drag.g.remove();const tg=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-slot]');
      if(tg&&wrap.contains(tg))place(tg.dataset.slot,drag.i);else if(drag.from){delete st.at[drag.from];render()}
      skip=true;setTimeout(()=>skip=false,50)}
    drag=null};
  document.addEventListener('pointermove',mv,{passive:false});document.addEventListener('pointerup',up);
  wrap.addEventListener('click',e=>{if(skip)return;
    const t=e.target.closest('.tok[data-i]');if(t){const i=+t.dataset.i;st.sel=st.sel===i?null:i;render();return}
    const s=e.target.closest('[data-slot]');if(!s)return;const id=s.dataset.slot;
    if(st.sel!=null)place(id,st.sel);else if(st.at[id]!=null){delete st.at[id];render()}});
  render();
  return{values,reset(){st.at={};st.sel=null;render()},
    set(map){st.at={};for(const k in map){const i=list.findIndex((t,j)=>String(t)===String(map[k])&&!used(j));if(i>=0)st.at[k]=i}render()},
    kill(){document.removeEventListener('pointermove',mv);document.removeEventListener('pointerup',up)}};
}

/* ---------- dessins ---------- */
function balanceSVG(L,R,tilt=0){
  const item=(it,x)=>{
    if(it.t==='w')return`<g transform="translate(${x} 0)"><rect x="-17" y="-30" width="34" height="28" fill="#fff" stroke="#333" stroke-width="2"/><path d="M-6 -36 q6 6 6 6 q0 0 6 -6" stroke="#c8102e" stroke-width="3" fill="none"/><line x1="0" y1="-30" x2="0" y2="-2" stroke="#c8102e" stroke-width="3"/>${it.l?`<text x="0" y="-11" font-size="13" text-anchor="middle" font-weight="700" fill="#c8102e">${it.l}</text>`:''}</g>`;
    if(it.t==='g')return`<g transform="translate(${x} 0)"><rect x="-14" y="-50" width="28" height="48" fill="#8a8f99" stroke="#333" stroke-width="2"/><path d="M-6 -56 q6 6 6 6 q0 0 6 -6" stroke="#17694a" stroke-width="3" fill="none"/>${it.l?`<text x="0" y="-22" font-size="13" text-anchor="middle" font-weight="700" fill="#fff">${it.l}</text>`:''}</g>`;
    if(it.t==='m')return`<g transform="translate(${x} 0)"><circle cx="0" cy="-48" r="7" fill="#222"/><path d="M-20 -2 L-14 -40 H14 L20 -2Z" fill="#222"/><text x="0" y="-14" font-size="${it.l.length>2?15:17}" text-anchor="middle" font-weight="700" fill="#fff">${it.l}</text></g>`;
    const juice=it.t==='full'?44:it.t==='half'?22:it.t==='jus'?22:0;
    if(it.t==='jus')return`<g transform="translate(${x} 0)"><rect x="-12" y="-24" width="24" height="22" rx="4" fill="#f0a020" stroke="#b8740d" stroke-width="2"/></g>`;
    return`<g transform="translate(${x} 0)"><rect x="-11" y="${-2-juice}" width="22" height="${juice}" fill="#f0a020"/><path d="M-11 -2 V-44 L-5 -52 V-60 H5 V-52 L11 -44 V-2Z" fill="none" stroke="#333" stroke-width="2"/></g>`;
  };
  const pan=items=>{const w=items.length>4?19:items.length>3?28:40,s=-(items.length-1)*w/2;return items.map((it,k)=>item(it,s+k*w)).join('')};
  const a=Math.max(-12,Math.min(12,tilt));
  return`<svg viewBox="0 0 360 170" style="width:100%;max-width:360px;height:auto"><g transform="rotate(${a} 180 70)">
  <line x1="80" y1="70" x2="280" y2="70" stroke="#333" stroke-width="6" stroke-linecap="round"/>
  <g transform="rotate(${-a} 80 70)"><line x1="80" y1="70" x2="80" y2="140" stroke="#999" stroke-width="2"/><path d="M10 140 H150 L136 152 H24Z" fill="#555"/><g transform="translate(80 140)">${pan(L)}</g></g>
  <g transform="rotate(${-a} 280 70)"><line x1="280" y1="70" x2="280" y2="140" stroke="#999" stroke-width="2"/><path d="M210 140 H350 L336 152 H224Z" fill="#555"/><g transform="translate(280 140)">${pan(R)}</g></g>
  </g><path d="M180 70 L162 165 H198Z" fill="#333"/><circle cx="180" cy="70" r="7" fill="#c8102e"/></svg>`;
}
function flower(t){
  const c={tulipe:['#d7263d','#a30d25'],lys:['#ffffff','#f2b632'],crocus:['#8e5cc7','#f2b632']}[t];
  if(t==='tulipe')return`<svg width="26" height="34" viewBox="0 0 26 34"><line x1="13" y1="16" x2="13" y2="34" stroke="#1f8a5f" stroke-width="3"/><path d="M4 6 L8 12 L13 4 L18 12 L22 6 L21 16 Q13 22 5 16Z" fill="${c[0]}" stroke="${c[1]}"/></svg>`;
  return`<svg width="26" height="34" viewBox="0 0 26 34"><line x1="13" y1="16" x2="13" y2="34" stroke="#1f8a5f" stroke-width="3"/>${[0,72,144,216,288].map(r=>`<ellipse cx="13" cy="5" rx="4" ry="7" fill="${c[0]}" stroke="#999" stroke-width=".6" transform="rotate(${r} 13 12)"/>`).join('')}<circle cx="13" cy="12" r="3.4" fill="${c[1]}"/></svg>`;
}
function isoCubes(step){
  const cubes=[[0,0,0]];
  for(let k=1;k<=step;k++)cubes.push([k,0,0],[-k,0,0],[0,k,0],[0,-k,0],[0,0,k]);
  cubes.sort((a,b)=>(a[0]+a[1])-(b[0]+b[1])||a[2]-b[2]);
  const s=24,c=Math.cos(Math.PI/6)*s,d=s/2;
  const P=(x,y,z)=>[ (x-y)*c, (x+y)*d - z*s ];
  const poly=pts=>pts.map(p=>p.join(',')).join(' ');
  return`<svg viewBox="-190 -110 380 230" style="width:100%;max-width:420px;height:auto">${cubes.map(([x,y,z])=>{
    const A=P(x,y,z+1),B=P(x+1,y,z+1),C=P(x+1,y+1,z+1),D=P(x,y+1,z+1),E=P(x+1,y,z),F=P(x+1,y+1,z),G=P(x,y+1,z);
    return`<polygon points="${poly([A,B,C,D])}" fill="#9fb3cf" stroke="#2b3550"/><polygon points="${poly([B,C,F,E])}" fill="#5a6f94" stroke="#2b3550"/><polygon points="${poly([D,C,F,G])}" fill="#3e5176" stroke="#2b3550"/>`}).join('')}</svg>`;
}

/* ---------- les 24 énigmes ---------- */
const OLD={},DAYS={};

OLD[1]=()=>{let lab={w:'',g:''};return{fam:'bal',titre:'Pesées',src:'Demi-finale 2026 – énigme 6',
 enonce:`<p>Voici trois balances. Les boîtes identiques ont toutes la même masse. <b>Chaque balance est en équilibre.</b></p><p><b>Quelle masse faut-il écrire sur le poids de la troisième balance ?</b></p>`,
 build(z){z.innerHTML=`<h3>Les trois balances</h3><div class="row" id="bals" style="justify-content:center"></div>`;draw()},
 fields:[{l:'1 boîte blanche pèse',a:50,u:'g'},{l:'1 boîte grise pèse',a:30,u:'g'},{l:'Masse de la 3<sup>e</sup> balance',a:80,u:'g',main:1}],
 onField(i,ok){if(ok&&i===0)lab.w='50';if(ok&&i===1)lab.g='30';draw()},
 hint:"Commence par la balance qui n'a qu'une seule sorte de boîte.",
 corr:`<ol><li>Balance 2 : 2 boîtes blanches = 100 g, donc 1 boîte blanche = 100 ÷ 2 = <b>50 g</b>.</li><li>Balance 1 : 1 boîte blanche + 40 g = 50 + 40 = 90 g. C'est le poids de 3 boîtes grises, donc 1 boîte grise = 90 ÷ 3 = <b>30 g</b>.</li><li>Balance 3 : 1 boîte blanche + 1 boîte grise = 50 + 30 = <b>80 g</b>.</li></ol>`};
 function draw(){const W={t:'w',l:lab.w},G={t:'g',l:lab.g};$('#bals').innerHTML=balanceSVG([W,{t:'m',l:'40'}],[G,G,G])+balanceSVG([{t:'m',l:'100'}],[W,W])+balanceSVG([W,G],[{t:'m',l:'?'}])}};

OLD[2]=()=>{let stage=0,n=0;return{fam:'bal',titre:'Jus de pomme',src:'Quart de finale 2025 – énigme 3',
 enonce:`<p>Une bouteille de jus de pomme <b>à moitié pleine</b> pèse exactement autant que <b>quatre bouteilles vides</b> identiques.</p><p><b>Si on posait une bouteille pleine sur le plateau de droite, combien de bouteilles vides faudrait-il placer sur le plateau de gauche pour équilibrer la balance ?</b></p>`,
 build(z){z.innerHTML=`<h3>Manipule la balance</h3><div id="b2" style="text-align:center"></div><p id="b2t" class="big" style="text-align:center"></p><div class="row" id="b2c" style="justify-content:center"></div>`;draw()},
 fields:[{l:'Nombre de bouteilles vides',a:7,main:1}],
 hint:"Que se passe-t-il si tu enlèves une bouteille vide de chaque côté ?",
 corr:`<ol><li>Au départ : 1 bouteille vide + un demi-jus = 4 bouteilles vides.</li><li>On enlève 1 bouteille vide de chaque côté : le jus d'une demi-bouteille pèse autant que <b>3 bouteilles vides</b>.</li><li>Une bouteille pleine = 1 bouteille vide + 2 demi-jus = 1 + 3 + 3 = <b>7 bouteilles vides</b>.</li></ol>`};
 function draw(){const E={t:'e'};let html,txt,ctl;
  if(stage===0){html=balanceSVG([{t:'half'}],[E,E,E,E]);txt="La bouteille à moitié pleine équilibre 4 bouteilles vides.";ctl=`<button class="btn" data-a="rm">Enlever 1 bouteille vide de chaque côté</button>`}
  else if(stage===1){html=balanceSVG([{t:'jus'}],[E,E,E]);txt="Il ne reste que le jus d'une demi-bouteille à gauche… Et la balance est toujours en équilibre !";ctl=`<button class="btn" data-a="test">Tester avec une bouteille pleine</button><button class="btn light" data-a="back">Recommencer</button>`}
  else{const L=Array(n).fill(E);html=balanceSVG(L,[{t:'full'}],(n-7)*3);txt=`${n} bouteille${n>1?'s':''} vide${n>1?'s':''} à gauche`+(n===7?' : équilibre !':'');ctl=`<button class="btn light" data-a="m">− 1</button><button class="btn" data-a="p">+ 1</button><button class="btn light" data-a="back">Recommencer</button>`}
  $('#b2').innerHTML=html;$('#b2t').textContent=txt;$('#b2c').innerHTML=ctl;
  $$('#b2c button').forEach(b=>b.onclick=()=>{const a=b.dataset.a;if(a==='rm')stage=1;if(a==='test')stage=2;if(a==='back'){stage=0;n=0}if(a==='p')n=Math.min(10,n+1);if(a==='m')n=Math.max(0,n-1);draw()})}};

OLD[3]=()=>{let T;return{fam:'plac',titre:"Le chapeau de l'année",src:'Quart de finale 2026 – énigme 2',
 enonce:`<p>En additionnant les trois nombres qui entourent chaque triangle, on doit toujours trouver <b>26</b>.</p><p><b>Place les nombres 7, 8, 9 et 11 dans les cercles vides.</b></p>`,
 build(z){const P={a:[130,205],b:[265,55],c:[330,130],d:[480,130]};const pct=([x,y])=>`left:${x/540*100}%;top:${y/250*100}%`;
  z.innerHTML=`<h3>Glisse les jetons dans les cercles (ou touche un jeton puis un cercle)</h3><div class="stage" style="max-width:560px;aspect-ratio:540/250">
  <svg viewBox="0 0 540 250"><g stroke="#333" stroke-width="3"><path d="M50 130 L205 130 L130 205Z M205 130 L265 55 L330 130Z M330 130 L480 130 L405 205Z" fill="#fff6d8"/></g>
  <g font-weight="700" font-size="20" text-anchor="middle"><text x="128" y="160">26</text><text x="267" y="112">26</text><text x="405" y="160">26</text></g></svg>
  <div class="fixed round" style="left:${50/5.4}%;top:52%">12</div><div class="fixed round" style="left:${205/5.4}%;top:52%">6</div><div class="fixed round" style="left:${405/5.4}%;top:82%">10</div>
  ${Object.entries(P).map(([k,p])=>`<div class="slot round" data-slot="${k}" style="${pct(p)}"></div>`).join('')}</div>
  <p>Triangle de gauche : <span id="s1"></span> · du milieu : <span id="s2"></span> · de droite : <span id="s3"></span></p><div class="tray"></div>`;
  T=tokens(z,[7,8,9,11],v=>{const s=(...a)=>a.includes(null)?'…':a.reduce((x,y)=>x+y,0);const w=(id,val)=>{const e=$('#'+id);e.innerHTML=val==='…'?'…':`<b class="chk ${val===26?'y':'n'}">${val}</b>`};w('s1',s(12,6,v.a));w('s2',s(6,v.b,v.c));w('s3',s(v.c,v.d,10))})},
 verify(){const v=T.values();if(Object.values(v).includes(null))return[false,'Place tous les jetons.'];return v.a===8&&v.b===11&&v.c===9&&v.d===7?[true,'Bravo ! Les trois triangles font 26.']:[false,"Un des triangles ne fait pas 26. Regarde les sommes."]},
 solve(){T.set({a:8,b:11,c:9,d:7})},
 hint:"Le triangle de gauche n'a qu'une seule case vide : commence par lui !",
 corr:`<ol><li>Triangle de gauche : 26 − 12 − 6 = <b>8</b>.</li><li>Triangle du milieu : il manque 26 − 6 = 20 avec deux nombres. Parmi 7, 9, 11 : 20 = 11 + 9.</li><li>Triangle de droite : il manque 26 − 10 = 16 = 9 + 7.</li><li>Le cercle commun aux triangles du milieu et de droite est donc <b>9</b>. Puis <b>11</b> en haut et <b>7</b> à droite.</li></ol>`,
 kill(){T&&T.kill()}}};

OLD[4]=()=>{let T;return{fam:'plac',titre:'Équi-cercles',src:'Demi-finale 2025 – énigme 3',

const isOpen=n=>true; // toutes les cases ouvertes dès maintenant
function renderDoors(){
  $('#doors').innerHTML=ORDER.map((n,i)=>{const o=isOpen(n),f=FAM[famOf[n]];return`<button class="door c${i%4} ${o?'':'locked'} ${store.solved[n]?'solved':''} ${isToday(n)?'today':''}" data-n="${n}" aria-label="Jour ${n}${o?'':' (fermé)'}"><svg class="bow" viewBox="0 0 60 34"><path d="M30 18 C14 2 2 6 6 16 C9 24 22 22 30 18Z" fill="#f2c94c" stroke="#b8860b" stroke-width="1.5"/><path d="M30 18 C46 2 58 6 54 16 C51 24 38 22 30 18Z" fill="#f2c94c" stroke="#b8860b" stroke-width="1.5"/><path d="M27 19 L20 33 M33 19 L40 33" stroke="#e0a82e" stroke-width="5" stroke-linecap="round"/><circle cx="30" cy="18" r="6" fill="#ffe28a" stroke="#b8860b" stroke-width="1.5"/></svg><span class="num">${n}</span>${o?`<span class="tag" style="border-bottom:5px solid ${f.col}">${f.nom}</span>`:''}</button>`}).join('');
  $$('.door').forEach(b=>b.onclick=()=>{const n=+b.dataset.n;if(isOpen(n))openDay(n);else toast(`Patience ! Cette case s'ouvrira le ${n} décembre.`)});
  const s=Object.keys(store.solved).length;$('#legend').innerHTML=s?`<b>${s}</b> énigme${s>1?'s':''} résolue${s>1?'s':''} ★`:'';
}
let tt;function toast(t){const e=$('#toast');e.innerHTML=t;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),2600)}
let D=null;
function openDay(n){
  if(D&&D.kill)D.kill();D=DAYS[n]();D.n=n;const f=FAM[D.fam],list=famDays(D.fam),rank=list.indexOf(n)+1;
  const prev=list.filter(d=>d<n);
  $('#card').innerHTML=`<div class="top"><button class="back" id="bk">← Calendrier</button><span class="date">${n} décembre</span><span class="fam" style="background:${f.col}">${f.nom}${list.length>1?` · énigme ${rank} sur ${list.length}`:''}</span></div>
  <h2>${D.titre}</h2><p class="src">${D.src}</p>
  <div class="methode" style="border-color:${f.col};background:${f.col}12"><b>${prev.length?`Même façon de raisonner que le ${prev.join(' et le ')} décembre. `:'Nouvelle façon de raisonner ! '}</b>${f.m}</div>
  <div class="enonce">${D.enonce}</div><div class="zone" id="zone"></div>
  <div class="answer"><h3 style="margin:0 0 6px">Ma réponse</h3><div id="flds"></div><div class="row" style="margin-top:8px"><button class="btn green" id="ck">Vérifier</button><button class="btn light" id="hi">Un coup de pouce</button><button class="btn light" id="co">Voir la correction</button></div><div class="fb" id="fb"></div><div id="hz"></div><div id="cz"></div></div>`;
  D.build($('#zone'));
  if(D.fields)$('#flds').innerHTML=D.fields.map((x,i)=>`<label class="field"><span>${x.l}</span><input id="f${i}" inputmode="numeric" autocomplete="off">${x.u?`<span>${x.u}</span>`:''}</label>`).join('');
  else $('#flds').innerHTML='<p style="margin:0">Complète la manipulation ci-dessus, puis vérifie.</p>';
  $('#ck').onclick=check;$('#bk').onclick=closeDay;
  $('#hi').onclick=()=>{$('#hz').innerHTML=`<div class="hint"><b>Coup de pouce :</b> ${D.hint}</div>`};
  $('#co').onclick=()=>{$('#cz').innerHTML=`<div class="corr"><b>Correction</b>${D.corr}${D.solve?'<button class="btn gold" id="sv">Montrer la solution dans le jeu</button>':''}</div>`;if(D.solve)$('#sv').onclick=()=>D.solve()};
  $$('#flds input').forEach(i=>i.addEventListener('keydown',e=>{if(e.key==='Enter')check()}));
  $('#day').classList.add('on');$('#day').scrollTop=0;document.body.style.overflow='hidden';
}
function check(){let ok=true,msg='';
  if(D.fields){D.fields.forEach((x,i)=>{const inp=$('#f'+i),g=num(inp.value)===x.a;inp.classList.toggle('good',g);inp.classList.toggle('bad',!g&&inp.value!=='');if(!g)ok=false;D.onField&&D.onField(i,g)});
    msg=ok?'Bravo, c\'est juste !':(D.fields.some((x,i)=>$('#f'+i).value==='')?'Complète toutes les cases.':'Pas encore… Relis l\'énoncé ou demande un coup de pouce.')}
  if(D.verify){const[v,m]=D.verify();if(!D.fields||ok){ok=ok&&v;msg=m}}
  const fb=$('#fb');fb.className='fb '+(ok?'ok':'ko');fb.textContent=msg;
  if(ok){store.solved[D.n]=1;save();burst()}}
function closeDay(){if(D&&D.kill)D.kill();D=null;$('#day').classList.remove('on');document.body.style.overflow='';renderDoors()}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&D)closeDay()});

/* ---------- mode libre (triple clic sur le titre) ---------- */
let clicks=0,ct;$('#title').addEventListener('click',()=>{clicks++;clearTimeout(ct);ct=setTimeout(()=>clicks=0,700);if(clicks>=3){clicks=0;store.free=!store.free;save();renderDoors();toast(store.free?'Toutes les cases sont ouvertes.':'Les cases s\'ouvrent jour après jour.')}});

/* ---------- neige ---------- */
const cv=$('#snow'),cx=cv.getContext('2d');let flakes=[],extra=[];
const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
function size(){cv.width=innerWidth;cv.height=innerHeight;flakes=Array.from({length:Math.round(innerWidth/14)},()=>({x:Math.random()*cv.width,y:Math.random()*cv.height,r:1+Math.random()*2.6,v:.4+Math.random()*1.1,w:Math.random()*6,g:Math.random()<.12}))}
function burst(){for(let i=0;i<60;i++)extra.push({x:innerWidth/2+(Math.random()-.5)*innerWidth*.8,y:-10-Math.random()*200,r:4+Math.random()*5,v:2+Math.random()*3,w:Math.random()*6,c:['#f2b632','#c8102e','#17694a','#fff'][i%4],life:260})}
function tick(t){cx.clearRect(0,0,cv.width,cv.height);
  for(const f of flakes){f.y+=f.v;f.x+=Math.sin(t/1400+f.w)*.4;if(f.y>cv.height){f.y=-5;f.x=Math.random()*cv.width}if(f.g){const a=.45+.55*Math.abs(Math.sin(t/400+f.w*3)),r=f.r*2.2;cx.fillStyle=`rgba(255,220,120,${a})`;cx.beginPath();cx.moveTo(f.x,f.y-r);cx.lineTo(f.x+r*.25,f.y-r*.25);cx.lineTo(f.x+r,f.y);cx.lineTo(f.x+r*.25,f.y+r*.25);cx.lineTo(f.x,f.y+r);cx.lineTo(f.x-r*.25,f.y+r*.25);cx.lineTo(f.x-r,f.y);cx.lineTo(f.x-r*.25,f.y-r*.25);cx.fill()}else{cx.fillStyle='rgba(255,255,255,.88)';cx.beginPath();cx.arc(f.x,f.y,f.r,0,7);cx.fill()}}
  extra=extra.filter(e=>e.life-->0);for(const e of extra){e.y+=e.v;e.x+=Math.sin(t/300+e.w);cx.fillStyle=e.c;cx.save();cx.translate(e.x,e.y);cx.rotate(t/400+e.w);cx.fillRect(-e.r/2,-e.r/2,e.r,e.r*1.6);cx.restore()}
  requestAnimationFrame(tick)}
size();addEventListener('resize',size);if(!still)requestAnimationFrame(tick);else burst=()=>{};

renderDoors();
}
</script>
</body>
</html>
