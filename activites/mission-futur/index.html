<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mission Futur 🚀</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --space:#0b0e2e; --space2:#232a7a;
  --card:#fffaf0; --ink:#1c1c36; --muted:#5b5b78;
  --rad:#FFE082; --irr:#FFB74D; --rmark:#D32F2F; --rbg:#FFCDD2; --term:#81D4FA;
  --ok:#2e7d32; --okbg:#e8f5e9; --ko:#c62828; --kobg:#ffebee;
  --violet:#7c4dff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:Andika,"Comic Sans MS",Verdana,Arial,sans-serif;font-size:20px;line-height:1.45;color:var(--ink);min-height:100vh;background:transparent}
html{
  min-height:100%;background-color:#0b0e2e;
  background:
    radial-gradient(1.5px 1.5px at 20px 30px,#fff,transparent),
    radial-gradient(1px 1px at 120px 80px,#fff,transparent),
    radial-gradient(1.5px 1.5px at 200px 160px,#ffe9a8,transparent),
    radial-gradient(1px 1px at 60px 200px,#fff,transparent),
    radial-gradient(1px 1px at 260px 40px,#cfe3ff,transparent),
    radial-gradient(ellipse at top, var(--space2), var(--space) 65%);
  background-size:300px 240px,300px 240px,300px 240px,300px 240px,300px 240px,100% 900px;
  background-repeat:repeat,repeat,repeat,repeat,repeat,no-repeat;
  background-color:#0b0e2e;
}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none}
input,textarea,select{font-family:inherit;font-size:22px}
header{
  position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;
  padding:8px 12px;background:rgba(11,14,46,.92);color:#fff;border-bottom:2px solid #3d47b5;
}
#logo{font-weight:700;font-size:24px;user-select:none;background:none;color:#fff;padding:4px}
.hbtns{display:flex;gap:6px;flex-wrap:wrap}
.hbtn{background:#2d357f;color:#fff;border-radius:999px;padding:6px 12px;font-size:17px}
.hbtn.on{background:#ffca28;color:#1c1c36;font-weight:700}
#app{max-width:860px;margin:0 auto;padding:14px 12px 60px}
.card{background:var(--card);border-radius:22px;padding:18px 18px 22px;box-shadow:0 8px 26px rgba(0,0,0,.35);margin-bottom:16px}
h1,h2,h3{margin:.2em 0 .4em;line-height:1.2}
h1{font-size:32px} h2{font-size:27px} h3{font-size:23px}
.white{color:#fff}
.center{text-align:center}
.big{font-size:26px}
.small{font-size:17px;color:var(--muted)}
.btn{background:var(--violet);color:#fff;border-radius:16px;padding:12px 20px;font-weight:700;margin:6px 4px;box-shadow:0 4px 0 #4a2ab8}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #4a2ab8}
.btn.green{background:#43a047;box-shadow:0 4px 0 #2e7d32}
.btn.grey{background:#8e8eaa;box-shadow:0 4px 0 #66667f}
.btn.yellow{background:#ffca28;color:#1c1c36;box-shadow:0 4px 0 #c79a00}
.secret{font-size:25px;letter-spacing:1px;line-height:1.9;background:#0b0e2e;color:#fff;border-radius:16px;padding:12px 14px;border:3px solid #ffca28;word-spacing:10px}
.secret .sg{display:inline-block;min-width:1em;text-align:center;color:#ffca28}
.secret .sl{display:inline-block;min-width:1em;text-align:center;color:#69f0ae;font-weight:700}
.secret .sl.new{animation:pop .8s;color:#fff;background:#43a047;border-radius:6px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#0b0e2e;color:#fff;border:3px solid #ffca28;border-radius:16px;padding:10px 16px;z-index:60;font-size:20px;box-shadow:0 6px 20px rgba(0,0,0,.4);animation:pop .5s;max-width:92vw}
.spk{background:#ffca28;border-radius:50%;width:46px;height:46px;font-size:24px;line-height:46px;padding:0;vertical-align:middle;margin:0 6px;flex:none;box-shadow:0 3px 0 #c79a00}
.spk.speaking{animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.12)}}
.speaking-block{outline:3px dashed #ffca28;outline-offset:4px;border-radius:8px}
.w.hl{background:#fff176;border-radius:4px}
.row{display:flex;align-items:center;gap:6px}
.inibo{display:flex;gap:12px;align-items:flex-start;margin:10px 0}
.inibo .av{flex:none;width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,#7c4dff,#00bcd4);display:flex;align-items:center;justify-content:center;font-size:30px;border:3px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.3)}
.inibo .bub{background:#ede7f6;border-radius:16px;padding:10px 14px;position:relative;flex:1}
.inibo .bub b.n{color:#5e35b1}
/* code couleur */
.rad{background:var(--rad);border-radius:6px;padding:0 2px}
.rad.irr{background:var(--irr)}
.rm{color:var(--rmark);background:var(--rbg);font-weight:700;border-radius:4px;padding:0 1px}
.te{background:var(--term);border-radius:6px;padding:0 2px}
.tc{background:#CE93D8;border-radius:6px;padding:0 2px}
.tile.c-tile{background:#CE93D8}
.mute{color:#6a1b9a;font-weight:700;text-decoration:underline;text-decoration-style:dotted;text-decoration-thickness:3px}
.pr{font-weight:700;color:#283593}
.legend{display:flex;flex-wrap:wrap;gap:8px;font-size:16px;margin-top:8px}
.legend span{padding:2px 8px;border-radius:8px}
table.conj{border-collapse:separate;border-spacing:0 6px;font-size:24px;margin:6px auto}
table.conj td{padding:2px 10px}
table.conj td:first-child{text-align:right}
.tables{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.tbox{background:#fff;border-radius:16px;padding:8px 12px;border:2px solid #e0dcef}
.tbox h4{margin:4px 0;text-align:center;font-size:22px}
/* map */
.map{position:relative;padding:10px 0}
.map:before{content:"";position:absolute;left:50%;top:30px;bottom:30px;border-left:4px dotted rgba(255,255,255,.4);z-index:0}
.planet{position:relative;z-index:1;display:flex;align-items:center;gap:14px;width:88%;margin:18px auto;padding:10px 14px;border-radius:24px;background:#1d2366;color:#fff;text-align:left;border:2px solid rgba(255,255,255,.15)}
.planet:nth-child(even){flex-direction:row-reverse;text-align:right}
.planet .orb{flex:none;width:78px;height:78px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:38px;box-shadow:inset -10px -10px 0 rgba(0,0,0,.18),0 0 18px rgba(255,255,255,.25)}
.planet .pn{font-size:23px;font-weight:700}
.planet .ps{font-size:17px;opacity:.9}
.planet .st{font-size:17px;margin-top:2px}
.planet.locked{color:#8d93c9}
.planet.locked .orb{filter:grayscale(.8) brightness(.7)}
.planet.current{border-color:#ffca28;background:#3b3a52}
.planet.current .orb{animation:glow 1.6s infinite}
@keyframes glow{50%{box-shadow:inset -10px -10px 0 rgba(0,0,0,.18),0 0 34px #ffca28}}
.pass{display:inline-block;background:#ffca28;color:#1c1c36;font-weight:700;border-radius:12px;padding:4px 12px;letter-spacing:1px}
/* tabs */
.ptitle{display:flex;align-items:center;gap:12px;color:#fff;margin-bottom:10px}
.ptitle .orb{width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;flex:none}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.tab{background:#2d357f;color:#fff;border-radius:16px 16px 8px 8px;padding:10px 4px;font-size:18px;font-weight:700;line-height:1.15}
.tab .ic{display:block;font-size:26px}
.tab.active{background:var(--card);color:var(--ink)}
.tab .ck{color:#69f0ae}
.tab.active .ck{color:var(--ok)}
/* exercises */
.sent{font-size:26px;line-height:1.6;background:#fff;border-radius:14px;padding:12px 14px;border:2px solid #e0dcef;flex:1}
.blank{display:inline-block;min-width:110px;border-bottom:3px solid #7c4dff;text-align:center}
.inf{color:var(--muted);font-size:21px}
.tiles{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:12px 0}
.tile{font-size:26px;padding:10px 18px;border-radius:14px;border:3px solid rgba(0,0,0,.12);box-shadow:0 4px 0 rgba(0,0,0,.18);min-width:70px;color:var(--ink)}
.tile.r-tile{background:var(--rad)} .tile.r-tile.irr{background:var(--irr)}
.tile.t-tile{background:var(--term)}
.tile.choice{background:#fff;border-color:#b39ddb}
.tile.good{outline:4px solid var(--ok)}
.tile.bad{opacity:.35;animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.ans{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center;margin-top:12px}
.ans input{padding:10px 12px;border-radius:12px;border:3px solid #b39ddb;width:260px;max-width:100%}
.fb{margin-top:12px;border-radius:14px;padding:10px 14px;font-size:20px}
.fb.ok{background:var(--okbg);color:var(--ok);border:2px solid #a5d6a7}
.fb.ko{background:var(--kobg);color:#8e1b1b;border:2px solid #ef9a9a}
.fb.info{background:#e3f2fd;color:#0d47a1;border:2px solid #90caf9}
.prog{display:flex;gap:6px;justify-content:center;margin-bottom:10px;flex-wrap:wrap}
.dot{width:20px;height:20px;border-radius:50%;background:#d1c4e9}
.dot.cur{background:#7c4dff;transform:scale(1.2)}
.dot.y{background:#43a047} .dot.n{background:#ef5350}
.when-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.when-btns .tile{background:#fff;min-width:140px}
mark{background:#fff176;border-radius:4px;padding:0 3px}
.slide{min-height:260px}
.sdots{display:flex;gap:6px;justify-content:center;margin:8px 0}
.nav{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap}
.timeline{display:flex;justify-content:space-around;text-align:center;margin:14px 0;gap:6px}
.timeline div{flex:1;border-radius:14px;padding:10px 4px;font-size:21px}
.eq{font-size:28px;text-align:center;margin:10px 0}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:flex;align-items:center;justify-content:center;padding:14px}
.modal{background:var(--card);border-radius:22px;padding:18px;max-width:560px;width:100%;max-height:90vh;overflow:auto}
.textq{font-size:23px;line-height:2.1;background:#fff;border-radius:14px;padding:12px 14px;border:2px solid #e0dcef}
.textq input,.textq select{font-size:21px;width:150px;padding:2px 6px;border-radius:8px;border:2px solid #b39ddb}
.textq input.good,.textq select.good{border-color:var(--ok);background:var(--okbg)}
.textq input.bad,.textq select.bad{border-color:var(--ko);background:var(--kobg)}
.corr{color:var(--ok);font-weight:700;font-size:19px}
.badge-big{font-size:80px;text-align:center;animation:pop .6s}
@keyframes pop{0%{transform:scale(.2)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
textarea{width:100%;min-height:140px;border-radius:14px;border:3px solid #b39ddb;padding:10px}
@media (max-width:560px){
  body{font-size:19px}
  .tab{font-size:15px} .tab .ic{font-size:22px}
  .sent{font-size:23px}
  .planet .orb{width:62px;height:62px;font-size:30px}
  .planet .pn{font-size:20px}
  h1{font-size:27px}
}
</style>
</head>
<body>
<header>
  <button id="logo" aria-label="Mission Futur">🚀 Mission Futur</button>
  <div class="hbtns">
    <button class="hbtn" id="hpass" style="display:none">🔑 Mot de passe</button>
    <button class="hbtn" id="hauto">🔊 Lecture auto</button>
    <button class="hbtn" id="hslow">🐢 Lent</button>
  </div>
</header>
<main id="app"></main>

<script>

/* =========================================================

 // Planète 5 : pouvoir, voir, venir, vouloir
 {inf:'pouvoir',rad:'pour',pl:5,irr:1,reg:'pouvoir',wrong:['pouvoi','peu'],comp:['jouer dehors','partir tôt']},

 // Planète 6 : radical qui change
 {inf:'appeler',rad:'appelle',pl:6,irr:1,reg:'appeler',wrong:['appele','appel'],comp:['le docteur','les pompiers']},

const VBY={}; VERBS.forEach(v=>VBY[v.inf]=v);

const PLANETS=[
 {name:'Planète Horloge',emoji:'🕰️',color:'#B39DDB',sub:'Passé, présent ou futur ?'},

 F:'Je sais conjuguer les verbes fréquents au futur.',

 G33:'CM2 : J\'identifie le sujet même quand il est inversé.',
 ACC1:'Je sais accorder le verbe et son sujet dans une phrase simple.',

 ACC10:'Je transforme à l\'écrit des phrases en faisant varier le temps.',
 C6:'6ème : Je sais conjuguer des verbes au conditionnel présent.',
 O2:'Je sais orthographier les verbes en -yer/-eter/-eler (au présent dans le livret).',
};
const PCODES=[
 {ev:[],tr:['G29']},
 {ev:['F1'],tr:['C3','ACC1']},

/* =========================================================
   CORRECTION
   ========================================================= */
function norm(s){return s.toLowerCase().replace(/[’`´]/g,"'").replace(/[.!?,;:]/g,'').replace(/\s+/g,' ').trim()
  .replace(/^(je |j'|j |tu |il |elle |on |nous |vous |ils |elles )/,'').trim();}
const noAcc=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'');
function hintRad(v){
  if(v.mute) return `N'oublie pas le <b>e</b> de l'infinitif « ${v.inf} », même si on ne l'entend pas.`;
  if(v.re) return `Pour les verbes en -re, on enlève juste le e final : « ${v.inf} » → ${esc(v.rad)}r-.`;
  if(v.pl===1||v.pl===2) return `Rappelle-toi : on garde l'infinitif entier (« ${v.inf} »), puis on ajoute la terminaison.`;
  return `Ce verbe change de radical au futur. Regarde le tableau.`;
}
function analyseCond(it,typed){
  const a=it.ans, t=norm(typed), v=it.v, stem=v.rad+'r';
  if(!t) return {ok:false,msg:'Écris ta réponse dans la case.'};
  if(t===a) return {ok:true};
  if(noAcc(t)===noAcc(a)) return {ok:false,msg:'Presque ! Regarde bien les accents.'};
  if(t===formE(v,it.k,END)) return {ok:false,msg:`✋ IniBO : Stop ! « ${esc(t)} », c'est le futur. Au conditionnel, on garde le radical du futur mais on met les terminaisons de l'imparfait : -ais, -ais, -ait, -ions, -iez, -aient.`};
  if(t.startsWith(stem)) return {ok:false,msg:`Le radical est juste 👍. Regarde le sujet : quelle terminaison de l'imparfait va avec « ${PLAB[it.k]} » ?`};
  if(t.endsWith('r'+COND[it.k])) return {ok:false,msg:`La terminaison est juste 👍. Le radical est le même qu'au futur. ${hintRad(v)}`};
  return {ok:false,msg:'Pas encore. Conditionnel = radical du futur + terminaison de l\'imparfait.'};
}
function analyse(it,typed){
  if(it.E===COND) return analyseCond(it,typed);
  const a=it.ans, t=norm(typed), v=it.v, end=END[it.k], stem=v.rad+'r';
  if(!t) return {ok:false,msg:'Écris ta réponse dans la case.'};
  if(t===a) return {ok:true};
  if(noAcc(t)===noAcc(a)){
    if(v.pl!==6) return {ok:true,note:`Attention à l'accent : on écrit « ${a} ».`};
    return {ok:false,msg:`Presque ! Regarde bien l'accent dans le radical.`};
  }
  if(v.pl===3 && v.reg && t===v.reg+end) return {ok:false,msg:`✋ IniBO : Stop ! Tu as écrit le verbe <b>${v.inf==='être'?'avoir':'être'}</b>. Ici, c'est le verbe « ${v.inf} ».`};
  if(v.mute && t===v.reg+end) return {ok:false,msg:`✋ IniBO : Stop ! Tu as oublié le <b>e</b> de l'infinitif « ${v.inf} ». On ne l'entend pas, mais on l'écrit !`};
  if(v.reg && t===v.reg+end) return {ok:false,msg:`✋ IniBO : Stop ! Au futur, « ${v.inf} » ne garde pas son infinitif : son radical change.`};
  if(t.startsWith(stem)) return {ok:false,msg:`Le radical est juste 👍. Regarde bien le sujet : qui fait l'action ? Quelle terminaison va avec ?`};
  if(t.endsWith('r'+end)) return {ok:false,msg:`La terminaison est juste 👍. C'est le radical qui ne va pas. ${hintRad(v)}`};
  if(!t.includes('r')) return {ok:false,msg:`N'oublie pas la marque du futur : le son <span class="rm">r</span> !`};
  return {ok:false,msg:'Pas encore. Écoute la phrase et réessaie.'};
}

function nextBtn(box,cb,label){const d=document.createElement('p');d.className='center';d.innerHTML=`<button class="btn green">${label||'Suivant ➜'}</button>`;box.appendChild(d);d.querySelector('button').onclick=cb;d.querySelector('button').focus();}
function fbHTML(cls,html,sayTxt){return `<div class="fb ${cls}"><div class="row">${sayTxt?spk(sayTxt):''}<div>${html}</div></div></div>`;}
function stripTags(h){const d=document.createElement('div');d.innerHTML=h;return d.textContent;}
function helpBtn(box,it){
  if(box.querySelector('.helpb')) return;
  const p=document.createElement('p');p.className='center helpb';p.innerHTML=`<button class="btn yellow">📋 Voir le tableau</button>`;box.appendChild(p);
  p.querySelector('button').onclick=()=>modal(`${tableHTML(it.v,null,it.E)}${LEGEND}<p class="center"><button class="btn" data-close>Fermer</button></p>`);

function renderQ(box,it,cfg,done){
  const id='q'+(++QID);
  if(it.type==='when') return renderWhen(box,it,cfg,done,id);
  if(it.type==='which') return renderWhich(box,it,cfg,done,id);
  if(it.type==='mc') return renderMC(box,it,cfg,done);
  const tname=it.E===COND?'au conditionnel présent':'au futur';
  if(cfg.mode==='guided') return it.cm2?renderGuidedCM2(box,it,done,id):renderGuided(box,it,done,id);
  box.innerHTML=`<p><b>${cfg.input==='qcm'?'Choisis':'Écris'} le verbe ${tname}.</b></p>${sentenceHTML(it,id)}<div class="zone"></div>`;
  const zone=box.querySelector('.zone');
  autoSay((cfg.input==='qcm'?'Choisis':'Écris')+' le verbe '+tname+'. '+it.say);
  let tries=cfg.mode==='solo'?2:1, firstOk=null;
  const finish=(ok,fbh)=>{
    if(cfg.mode==='scan'){done(ok);return;}
    fillBlank(box,it);
    zone.insertAdjacentHTML('beforeend',fbh);
    const sent=fullSentence(it);
    autoSay(stripTags(fbh)+' '+sent);
    nextBtn(zone,()=>done(firstOk));
  };
  const wrong=(msg)=>{
    tries--; if(firstOk===null) firstOk=false;
    if(tries>0){ const f=zone.querySelector('.fb'); if(f) f.remove(); zone.insertAdjacentHTML('beforeend',fbHTML('ko',msg,stripTags(msg))); autoSay(stripTags(msg)); helpBtn(zone,it); return false; }
    const f=zone.querySelector('.fb'); if(f) f.remove(); const hb=zone.querySelector('.helpb'); if(hb) hb.remove();
    finish(false,fbHTML('info',`La bonne réponse est : <b>${colorForm(it.v,it.k,it.E)}</b>.<br>${esc(fullSentence(it))}`,`La bonne réponse est : ${it.ans}. ${fullSentence(it)}`));
    return true;
  };
  if(cfg.input==='qcm'){
    const ch=qcmChoices(it);
    zone.innerHTML=`<div class="tiles">${ch.map(c=>`<button class="tile choice" data-c="${esc(c)}">${esc(c)}</button>`).join('')}</div>${cfg.mode==='scan'?'<p class="center"><button class="btn grey" id="dk">🤔 Je ne sais pas encore</button></p>':''}`;
    zone.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{
      if(b.disabled) return;
      if(cfg.mode==='scan'){done(b.dataset.c===it.ans);return;}
      if(b.dataset.c===it.ans){ if(firstOk===null) firstOk=true; zone.querySelectorAll('.tile').forEach(x=>x.disabled=true); b.classList.add('good'); finish(true,fbHTML('ok','✅ '+rnd(PRAISE))); }
      else { b.classList.add('bad'); b.disabled=true; const fin=wrong(qcmHint(it,b.dataset.c)); if(fin) zone.querySelectorAll('.tile').forEach(x=>x.disabled=true); }
    });
    if(cfg.mode==='scan') zone.querySelector('#dk').onclick=()=>done(false);
  } else {
    zone.innerHTML=`<div class="ans"><input type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Ta réponse"><button class="btn green vb">Valider</button></div>${cfg.mode==='scan'?'<p class="center"><button class="btn grey" id="dk">🤔 Je ne sais pas encore</button></p>':''}`;
    const inp=zone.querySelector('input'), vb=zone.querySelector('.vb');
    const submit=()=>{
      if(cfg.mode==='scan'){ if(!norm(inp.value)) return; done(analyse(it,inp.value).ok); return; }
      const r=analyse(it,inp.value);
      if(!norm(inp.value)) return;
      if(r.ok){ if(firstOk===null) firstOk=true; inp.disabled=true; vb.disabled=true; const f=zone.querySelector('.fb'); if(f) f.remove(); const hb=zone.querySelector('.helpb'); if(hb) hb.remove(); finish(true,fbHTML('ok','✅ '+rnd(PRAISE)+(r.note?'<br>'+esc(r.note):''))); }
      else { const fin=wrong(r.msg); if(fin){inp.disabled=true; vb.disabled=true;} else {inp.select();} }
    };
    vb.onclick=submit; inp.addEventListener('keydown',e=>{if(e.key==='Enter')submit();});
    if(cfg.mode==='scan') zone.querySelector('#dk').onclick=()=>done(false);
    setTimeout(()=>{try{inp.focus({preventScroll:true});}catch(e){}},50);
  }
}
function qcmHint(it,c){
  const v=it.v;
  if(it.E===COND){ if(c===formE(v,it.k,END)) return `✋ IniBO : Stop ! « ${esc(c)} », c'est le futur. Au conditionnel : terminaisons de l'imparfait.`; return `Le radical est juste, mais la terminaison ne va pas avec le sujet. Qui fait l'action ?`; }
  if(v.reg && c===v.reg+END[it.k]){
    if(v.pl===3) return `✋ IniBO : Stop ! « ${esc(c)} », c'est le verbe ${v.inf==='être'?'avoir':'être'}. Ici, c'est « ${v.inf} ».`;
    if(v.mute) return `✋ IniBO : Stop ! Il manque le <b>e</b> de l'infinitif « ${v.inf} ».`;
    return `✋ IniBO : Stop ! Au futur, « ${v.inf} » change de radical.`;
  }
  return `Le radical est juste, mais la terminaison ne va pas avec le sujet. Qui fait l'action ?`;
}

function renderGuided(box,it,done,id){
  const v=it.v; const rads=radChoices(v); let first=true, errR=0, errT=0;

   <div class="step2" style="display:none"><p><b>2️⃣ Choisis la terminaison.</b> ${spk('Étape 2 : choisis la terminaison. Regarde bien le sujet : qui fait l\'action ?')}</p>

      zone.innerHTML=''; box.querySelector('.step2').style.display='';

      else msg('ko',`Regarde bien le sujet : qui fait l'action ? Astuce d'IniBO : les terminaisons ressemblent au verbe avoir (j'ai, tu as, il a, nous avons, vous avez, ils ont).`);

function runSeries(box,items,cfg,onEnd){
  let i=0; const res=[];
  const show=()=>{
    if(i>=items.length){onEnd(res.filter(Boolean).length,res);return;}
    box.innerHTML=`<div class="prog">${items.map((_,j)=>`<span class="dot ${j<i?(res[j]?'y':'n'):j===i?'cur':''}"></span>`).join('')}</div><div class="q"></div>`;
    renderQ(box.querySelector('.q'),items[i],cfg,ok=>{res.push(!!ok);i++;show(); box.scrollIntoView({block:'start',behavior:'smooth'});});
  };
  show();
}

/* =========================================================
   SCANNER (test de départ)
   ========================================================= */
function scanIntro(){
  window.scrollTo(0,0);
  const t='Le scanner va te poser quelques questions pour trouver ta planète de départ. Ce n\'est pas une évaluation : il n\'y a ni note ni piège. Si tu ne sais pas, clique sur « Je ne sais pas encore » : c\'est la meilleure façon d\'aider le scanner à trouver la bonne planète pour toi. Pour réussir à faire avancer le scanner, il faut au moins deux bonnes réponses pour chaque famille de verbes.';
  app().innerHTML=`<div class="card"><h2>🛸 Le scanner du voyageur</h2>${inibo(t,'stxt')}<p class="center"><button class="btn green" id="sgo">C'est parti !</button></p></div>`;
  autoSay(t,document.getElementById('stxt'));
  document.getElementById('sgo').onclick=startScan;
}
let SC=null;
function startScan(){ SC={fam:1,hist:{},tested0:false,used:{},n:0,phase:'fam'}; nextScan(); }
function scanPick(fam){
  if(fam===0) return whichItem(rnd(WHICH));
  const vs=VERBS.filter(v=>v.pl===fam && !SC.used[v.inf]); const v=rnd(vs.length?vs:VERBS.filter(v=>v.pl===fam)); SC.used[v.inf]=1;
  return verbItem(v);
}
function scanFrame(inner){
  app().innerHTML=`<div class="card"><div class="row" style="justify-content:space-between"><h3>🛸 Scanner en cours…</h3><span class="small">Question ${SC.n}</span></div><div class="q"></div></div>`;
  return app().querySelector('.q');
}
function nextScan(){
  window.scrollTo(0,0);
  if(SC.phase==='prod') return nextProd();
  SC.n++;
  const fam=SC.fam; const it=scanPick(fam);
  const box=scanFrame();
  renderQ(box,it,{mode:'scan',input:'qcm'},ok=>{
    const h=SC.hist[fam]||(SC.hist[fam]=[]); h.push(!!ok);
    const n=h.length,c=h.filter(Boolean).length;
    let dec=null;
    if(n===2&&c===2) dec='pass'; else if(n===2&&c===0) dec='fail'; else if(n===3) dec=c>=2?'pass':'fail';
    if(dec==='pass'){
      if(fam===0) return placeAt(1);
      if(fam===6){SC.phase='prod';SC.prod=prodItems();SC.pi=0;SC.pres=[];return nextScan();}
      SC.fam=fam+1;
    } else if(dec==='fail'){
      if(fam===1&&!SC.tested0){SC.tested0=true;SC.fam=0;}
      else if(fam===0) return placeAt(0);
      else return placeAt(fam);
    }
    nextScan();
  });
}
function prodItems(){
  const out=[3,4,5,6].map(pl=>{const vs=VERBS.filter(v=>v.pl===pl&&!SC.used[v.inf]);return verbItem(rnd(vs.length?vs:VERBS.filter(v=>v.pl===pl)));});
  out.push(cm2Item(rnd(CM2)));
  return out;
}
function nextProd(){
  if(SC.pi>=SC.prod.length){
    const ok=SC.pres.filter(Boolean).length;
    if(ok>=4) return placeAt(7);
    let m=7; SC.prod.forEach((it,i)=>{if(!SC.pres[i]) m=Math.min(m,it.cm2?7:it.v.pl);}); return placeAt(m);
  }
  SC.n++;
  const box=scanFrame();
  if(SC.pi===0) box.insertAdjacentHTML('beforebegin',fbHTML('info','🌟 Bravo, tu connais beaucoup de verbes ! Dernière étape du scanner : cette fois, tu écris toi-même le verbe.'));
  const it=SC.prod[SC.pi];
  renderQ(box,it,{mode:'scan',input:'type'},ok=>{SC.pres.push(!!ok);SC.pi++;nextScan();});
}
function placeAt(p){
  S.unlocked=p; S.placed=true; S.start=p; S.scanDate=new Date().toLocaleDateString('fr-FR'); save(); refreshHeader(); window.scrollTo(0,0);
  const P=PLANETS[p];
  const t=p===0?'Ta mission commence sur la Planète Horloge : tu vas apprendre à reconnaître le futur.':
    p===7?'Incroyable ! Tu connais déjà tous les verbes au futur. Tu pars directement à la Station CM2, pour t\'entraîner dans des phrases et des textes.':
    `Ta mission commence sur la ${P.name}. Tu connais déjà les planètes d'avant : elles sont validées ! Tu peux quand même y retourner pour réviser.`;
  app().innerHTML=`<div class="card center"><h2>Scan terminé ✅</h2>
   <div class="badge-big">${P.emoji}</div><h2>${P.name}</h2>${inibo(t,'ptxt')}
   <p>Ton mot de passe : <span class="pass">${code(p)}</span> ${spk('Ton mot de passe est : '+code(p).replace('-',', tiret, ')+'.')}</p>
   <p class="small">Note-le : il te permet de continuer sur n'importe quel appareil.</p>
   ${p>0?`<p>🔐 Les planètes déjà validées t'ont donné ${found1().size} lettres du message secret. Va voir sur la carte !</p>`:`<p>🔐 À chaque planète validée, tu gagneras des lettres d'un message secret…</p>`}
   <p><button class="btn green" id="tomap">🗺️ Voir la carte de la galaxie</button></p></div>`;
  autoSay(t,document.getElementById('ptxt'));
  document.getElementById('tomap').onclick=()=>showMap();
}

const SECRET1={title:'Message secret n°1',
  text:'SUR LA LUNE, LES TRACES DE PAS RESTERONT DES MILLIONS D\'ANNÉES !',
  keys:[['E'],['S'],['A','N'],['R','T'],['L','O'],['U','D'],['C','I'],['P','M']],
  expl:'Sur la Lune, il n\'y a ni vent ni pluie pour effacer les traces. Les empreintes laissées par les astronautes en 1969 sont toujours là, et elles pourraient rester des millions d\'années ! Et tu as remarqué ? « resteront » est au futur.'};
const SECRET2={title:'Message secret n°2',
  text:'LE CONDITIONNEL VIENT DU LATIN : CHANTER + J\'AVAIS',
  keys:{d:['E','L','N'],m:['I','T','O'],q:['A','C','D'],p:['V','U','S'],c:['H','R','J']},
  expl:'Il y a très longtemps, en latin, on disait « cantare habebam » : « j\'avais à chanter ». Avec les siècles, c\'est devenu « je chanterais ». Voilà pourquoi le conditionnel garde le r de l\'infinitif et prend les terminaisons de l\'imparfait, comme « avais » ! Et le futur ? Même histoire : « cantare habeo », « j\'ai à chanter », est devenu « je chanterai ».'};
const GLYPHS='▲△▼▽◆◇○●□■◐◑◒◓◢◣◤◥◧◨◩◪◬◭◮◎';
const base=c=>noAcc(c).toUpperCase();
const glyphOf=c=>GLYPHS[base(c).charCodeAt(0)-65]||'?';
function found1(){const n=Math.min(S.unlocked,8); const f=new Set(); for(let i=0;i<n;i++) SECRET1.keys[i].forEach(x=>f.add(x)); return f;}
function found2(){const f=new Set(); const all=S.unlocked>=9; Object.entries(SECRET2.keys).forEach(([t,ks])=>{ if(all||(t!=='c'&&S.tabs[8]&&S.tabs[8][t])) ks.forEach(x=>f.add(x)); }); return f;}
function lettersOf(txt){return new Set([...txt].map(base).filter(c=>/[A-Z]/.test(c)));}
function isComplete(M,f){return [...lettersOf(M.text)].every(c=>f.has(c));}
function codedHTML(M,f,fresh){
  fresh=fresh||[];
  return M.text.split(' ').map(w=>'<span style="white-space:nowrap">'+[...w].map(c=>{const b=base(c); if(!/[A-Z]/.test(b)) return esc(c);
    return f.has(b)?`<span class="sl${fresh.includes(b)?' new':''}">${esc(c)}</span>`:`<span class="sg">${glyphOf(c)}</span>`;}).join('')+'</span>').join(' ');
}
function secretCard(M,f,label){
  const done=isComplete(M,f); const id='sx'+Math.random().toString(36).slice(2,7);
  return `<div class="card"><h3>🔐 ${M.title}</h3>
    <div class="secret">${codedHTML(M,f)}</div>
    ${done?`<div class="fb ok"><div class="row">${spk(M.text.toLowerCase()+'. '+M.expl)}<div><b>Message décodé !</b><br><span id="${id}" class="kara">${esc(M.expl)}</span></div></div></div>`
      :`<p class="small">${label}</p><p class="center"><button class="btn yellow guess" data-m="${M===SECRET1?1:2}">🕵️ Je crois avoir deviné !</button></p>`}</div>`;
}

}

/* ---- Défi Station CM2 : transposer un texte ---- */
function defiText(pc,idx){
  const T=TEXTS[idx==null?Math.floor(Math.random()*TEXTS.length):idx];
  const tidx=TEXTS.indexOf(T);
  const qcm=!!S.qcm; let n=0;
  const gaps=[];
  const body=T.seg.map(s=>{
    if(typeof s==='string') return esc(s);
    const v=VBY[s[0]], k=s[1], ans=form(v,k), it={v,k,ans}; gaps.push(it); const i=n++;
    if(qcm) return `<select data-g="${i}" aria-label="${v.inf}"><option value="">(${esc(v.inf)})</option>${qcmChoices(it).map(c=>`<option>${esc(c)}</option>`).join('')}</select>`;
    return `<input data-g="${i}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="${esc(v.inf)}" aria-label="${v.inf}">`;
  }).join('');
  const intro='Le grand Défi de la Station : ce texte est au présent. Réécris-le au futur ! Avec 80 sur 100 de bonnes réponses, tu termines la mission.';
  pc.innerHTML=`${inibo(intro,'ti')}${livretLine(7)}${inputModeBar()}
   <h3>📜 ${esc(T.title)} <span class="small">(au présent)</span></h3>
   <div class="row">${spk(null,'tp')}<div class="sent kara" id="tp" style="font-size:22px">${esc(T.present)}</div></div>
   <h3 style="margin-top:16px">⏩ Au futur :</h3>
   <div class="textq">${body}</div>
   <div id="tfb"></div><p class="center"><button class="btn green" id="tv">Vérifier</button></p>`;
  bindInputMode(pc,()=>defiText(pc,tidx));
  autoSay(intro);
  pc.querySelector('#tv').onclick=()=>{
    let ok=0;
    pc.querySelectorAll('[data-g]').forEach(el=>{
      const g=gaps[+el.dataset.g]; const r=qcm?{ok:el.value===g.ans}:analyse(g,el.value);
      el.classList.remove('good','bad'); el.disabled=true;
      if(r.ok){ok++;el.classList.add('good');} else {el.classList.add('bad'); el.insertAdjacentHTML('afterend',` <span class="corr">→ ${colorForm(g.v,g.k)}</span>`);}
    });
    const need=Math.ceil(gaps.length*0.8);
    pc.querySelector('#tv').remove();
    const futText=T.seg.map(s=>typeof s==='string'?s:form(VBY[s[0]],s[1])).join('');
    pc.querySelector('#tfb').innerHTML=`<div class="fb ${ok>=need?'ok':'ko'}">${ok} bonnes réponses sur ${gaps.length}.</div><div class="row" style="margin-top:8px">${spk(futText)}<span>Écouter le texte au futur</span></div><p class="center"><button class="btn green" id="tn">Suite ➜</button> <button class="btn grey" id="tr">🔁 Un autre texte</button></p>`;
    autoSay(`${ok} bonnes réponses sur ${gaps.length}.`);
    pc.querySelector('#tr').onclick=()=>defiText(pc);
    pc.querySelector('#tn').onclick=()=>{
      markTab(7,'c');
      if(ok>=need){ defiResult(pc,7,true,`${ok} sur ${gaps.length}`); bonus(pc); }
      else defiResult(pc,7,false,`${ok} sur ${gaps.length}`);
    };
  };
}

function condItem(v,k){
  if(k==null) k=rnd([0,1,2,3,4,5]);
  const P=rnd(PRON.filter(p=>p.k===k)); const ans=formE(v,k,COND);
  let pd=P.p; if(k===0&&VOW.test(ans)) pd="j'";

  return {type:'verb',E:COND,v,k,ans,before:ctx+' '+pd,after:' '+comp+'.',say:`${ctx} ${P.p} … ${comp}. Le verbe : ${v.inf}.`};
}
function condSpec(row){
  const [s,inf,k,use]=row; const v=VBY[inf]; const [b,a]=s.split('____');

    expl:`Astuce d'IniBO : remplace « je » par « tu ». ${isC?`« tu ${formE(v,1,COND)} » → conditionnel → ${formE(v,0,COND)}`:`« tu ${formE(v,1,END)} » → futur → ${formE(v,0,END)}`}.`,fill:colorForm(v,0,isC?COND:END)};

function renderMC(box,it,cfg,done){
  box.innerHTML=`<p><b>${esc(it.q)}</b> ${spk(it.q)}</p><div class="row">${spk(it.say)}<div class="sent">${it.sentHTML}</div></div>
   <div class="tiles">${it.opts.map((o,i)=>`<button class="tile choice" data-i="${i}">${esc(o.t)}</button>`).join('')}</div><div class="zone"></div>`;
  autoSay(it.q+' '+it.say);
  const zone=box.querySelector('.zone'); let tries=cfg.mode==='defi'?1:2, first=null;
  box.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{
    if(b.disabled) return; const ok=it.opts[+b.dataset.i].ok;
    if(first===null) first=ok;
    if(ok||--tries<=0){
      box.querySelectorAll('.tile').forEach((x,i)=>{x.disabled=true; if(it.opts[i].ok) x.classList.add('good');});
      if(it.fill){const bl=box.querySelector('.blank'); if(bl){bl.innerHTML=it.fill; bl.style.borderBottom='none';}}
      const m=(ok?'✅ '+rnd(PRAISE)+' ':'')+it.expl; zone.innerHTML=fbHTML(ok?'ok':'info',esc(m),m); autoSay(m); nextBtn(zone,()=>done(first));
    } else { b.classList.add('bad'); b.disabled=true; const m='Pas encore. Regarde bien la terminaison.'; zone.innerHTML=fbHTML('ko',m,m); autoSay(m); }
  });
}

/* ---- Défi : texte au conditionnel ---- */
function defiCond(pc,idx){
  const T=CTEXTS[idx==null?Math.floor(Math.random()*CTEXTS.length):idx]; const tidx=CTEXTS.indexOf(T);
  const qcm=!!S.qcm; let n=0; const gaps=[];
  const body=T.seg.map(s=>{
    if(typeof s==='string') return esc(s);
    const v=VBY[s[0]], k=s[1], it={type:'verb',E:COND,v,k,ans:formE(v,k,COND)}; gaps.push(it); const i=n++;
    if(qcm) return `<select data-g="${i}" aria-label="${v.inf}"><option value="">(${esc(v.inf)})</option>${qcmChoices(it).map(c=>`<option>${esc(c)}</option>`).join('')}</select>`;
    return `<input data-g="${i}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="${esc(v.inf)}" aria-label="${v.inf}">`;
  }).join('');
  const intro='Le Défi de la Planète Rêverie : complète le texte avec les verbes au conditionnel présent. Avec 80 sur 100 de bonnes réponses, tu gagnes l\'étoile bonus !';
  const plain=T.seg.map(s=>typeof s==='string'?s:' … ').join('');
  pc.innerHTML=`${inibo(intro,'ci')}${livretLine(8)}${inputModeBar()}
   <h3>🌈 ${esc(T.title)} ${spk(plain)}</h3><div class="textq">${body}</div>
   <div id="tfb"></div><p class="center"><button class="btn green" id="tv">Vérifier</button></p>`;
  bindInputMode(pc,()=>defiCond(pc,tidx));
  autoSay(intro);
  pc.querySelector('#tv').onclick=()=>{
    let ok=0;
    pc.querySelectorAll('[data-g]').forEach(el=>{
      const g=gaps[+el.dataset.g]; const r=qcm?{ok:el.value===g.ans}:analyse(g,el.value);
      el.classList.remove('good','bad'); el.disabled=true;
      if(r.ok){ok++;el.classList.add('good');} else {el.classList.add('bad'); el.insertAdjacentHTML('afterend',` <span class="corr">→ ${colorForm(g.v,g.k,COND)}</span>`);}
    });
    const need=Math.ceil(gaps.length*0.8);
    pc.querySelector('#tv').remove();
    const full=T.seg.map(s=>typeof s==='string'?s:formE(VBY[s[0]],s[1],COND)).join('');
    pc.querySelector('#tfb').innerHTML=`<div class="fb ${ok>=need?'ok':'ko'}">${ok} bonnes réponses sur ${gaps.length}.</div><div class="row" style="margin-top:8px">${spk(full)}<span>Écouter le texte complet</span></div><p class="center"><button class="btn green" id="tn">Suite ➜</button> <button class="btn grey" id="tr">🔁 Un autre texte</button></p>`;
    autoSay(`${ok} bonnes réponses sur ${gaps.length}.`);
    pc.querySelector('#tr').onclick=()=>defiCond(pc,(tidx+1)%CTEXTS.length);
    pc.querySelector('#tn').onclick=()=>{ markTab(8,'c'); defiResult(pc,8,ok>=need,`${ok} sur ${gaps.length}`); };
  };
}

   <h4>Mots de passe</h4><table class="conj" style="font-size:17px">${PLANETS.map((P,i)=>`<tr><td>${P.emoji} Départ ${P.name}</td><td><b>${code(i)}</b></td></tr>`).join('')}<tr><td>⭐ Mission terminée (bonus compris)</td><td><b>${code(9)}</b></td></tr></table>

}
