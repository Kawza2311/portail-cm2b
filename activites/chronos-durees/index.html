<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Académie Chronos – Mission Durées</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0f30;--card:#151d52;--card2:#1d2768;--ink:#f6f7ff;--muted:#b7bfe8;--pink:#ff4fa3;--cyan:#38e1ff;--yellow:#ffd23f;--green:#2fd67b;--orange:#ff9f43;--violet:#a78bfa;--blue:#3b82f6;--paper:#fffdf6;--paperInk:#1e2440}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Nunito,system-ui,sans-serif;font-size:21px;color:var(--ink);min-height:100vh;
 background:radial-gradient(1200px 600px at 85% -10%,#3b1d7a 0%,transparent 60%),radial-gradient(900px 500px at -10% 110%,#0f4c75 0%,transparent 60%),var(--bg);background-attachment:fixed}
.stars{position:fixed;inset:0;pointer-events:none;z-index:0;
 background-image:radial-gradient(2px 2px at 20px 30px,#fff,transparent),radial-gradient(1.5px 1.5px at 140px 80px,#cfe,transparent),radial-gradient(2px 2px at 260px 160px,#fff,transparent),radial-gradient(1px 1px at 330px 40px,#fff,transparent),radial-gradient(1.5px 1.5px at 90px 190px,#ffd,transparent);
 background-size:380px 230px;opacity:.7;animation:tw 6s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.45}to{opacity:.9}}
main{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:22px 22px 60px}
h1,h2,h3{font-family:"Baloo 2",Nunito,sans-serif;margin:0;line-height:1.1}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:0}
.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.logo{display:flex;align-items:center;gap:12px;cursor:pointer}
.logo h1{font-size:38px;background:linear-gradient(90deg,var(--yellow),var(--pink),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
.logo small{display:block;font-size:17px;color:var(--muted);font-family:Nunito}
.tabs{display:flex;gap:10px;margin-left:auto;flex-wrap:wrap}
.tab{padding:10px 18px;border-radius:999px;background:var(--card);color:var(--ink);font-weight:900;border:2px solid #2c3a8a}
.tab.on{background:linear-gradient(135deg,var(--pink),#ff7a59);border-color:transparent}
.toggle{padding:8px 14px;border-radius:999px;background:transparent;color:var(--muted);border:2px dashed #3a4794;font-size:16px}
body.nobadge .badge{display:none!important}
.badge{display:inline-block;font-size:16px;font-weight:900;padding:3px 10px;border-radius:8px;margin:2px 4px 2px 0;vertical-align:middle}
.b-lvl{background:var(--yellow);color:#3a2a00}
.b-code{background:var(--cyan);color:#022a36}
.b-fiche{background:#e9d5ff;color:#3b0764}
/* home */
.hero{display:grid;grid-template-columns:220px 1fr;gap:26px;align-items:center;background:linear-gradient(135deg,#1b2470,#2a1660);border-radius:28px;padding:26px;border:2px solid #34408f}
.hero p{font-size:23px;line-height:1.45;margin:10px 0 0}
.bubble{background:var(--paper);color:var(--paperInk);border-radius:22px;padding:18px 22px;position:relative;font-size:22px}
.bubble:before{content:"";position:absolute;left:-18px;top:40px;border:12px solid transparent;border-right:16px solid var(--paper)}
.planets{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:24px}
.planet{background:var(--card);border-radius:26px;padding:22px;text-align:center;border:2px solid #2c3a8a;color:var(--ink);transition:transform .2s}
.planet:hover{transform:translateY(-6px) rotate(-1deg)}
.planet .orb{width:120px;height:120px;border-radius:50%;margin:0 auto 12px;position:relative;box-shadow:inset -18px -14px 0 rgba(0,0,0,.25),0 0 40px rgba(255,255,255,.15)}
.planet .orb:after{content:"";position:absolute;left:-22px;right:-22px;top:50%;height:20px;margin-top:-10px;border:4px solid rgba(255,255,255,.55);border-radius:50%;transform:rotate(-18deg)}
.planet h3{font-size:30px}
.planet .sub{color:var(--muted);font-size:18px}
.fuel{height:16px;background:#0b1240;border-radius:99px;overflow:hidden;margin-top:12px;border:2px solid #34408f}
.fuel i{display:block;height:100%;background:linear-gradient(90deg,var(--orange),var(--yellow));width:0;transition:width .6s}
.fuelt{font-size:16px;color:var(--muted);margin-top:4px}
/* level */
.lvlhead{display:flex;align-items:center;gap:20px;margin:6px 0 18px;flex-wrap:wrap}
.lvlhead h2{font-size:40px}
.lvlhead .sub{color:var(--muted);font-size:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:18px}
.mcard{background:var(--card);border:2px solid #2c3a8a;border-radius:22px;padding:18px 20px;text-align:left;color:var(--ink);display:flex;flex-direction:column;gap:8px;transition:transform .15s,border-color .15s}
.mcard:hover{transform:translateY(-4px);border-color:var(--cyan)}
.mcard .num{font-family:"Baloo 2";font-size:18px;color:var(--yellow)}
.mcard h3{font-size:27px}
.mcard .st{font-size:24px;letter-spacing:2px}
/* mission */
.mhead{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.back{background:var(--card2);color:var(--ink);padding:10px 16px;border-radius:14px;font-weight:900}
.mhead h2{font-size:36px}
.step{background:var(--card);border-radius:24px;padding:20px 22px;margin-bottom:20px;border:2px solid #2c3a8a}
.step h3{font-size:28px;margin-bottom:12px}
.step h3 .hint{font-family:Nunito;font-size:18px;color:var(--muted);font-weight:700}
.go{background:linear-gradient(135deg,var(--pink),#ff7a59);color:#fff;font-weight:900;padding:14px 26px;border-radius:16px;font-size:24px;box-shadow:0 6px 0 #a3125c}
.go:active{transform:translateY(3px);box-shadow:0 3px 0 #a3125c}
.go.alt{background:linear-gradient(135deg,#2bb3ff,#5b6cff);box-shadow:0 6px 0 #1d3a99}
.go.green{background:linear-gradient(135deg,#25c26d,#11a35a);box-shadow:0 6px 0 #0a6a3a}
.paper{background:var(--paper);color:var(--paperInk);border-radius:20px;padding:20px 22px}
.qtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.dots{display:flex;gap:8px}
.dots i{width:18px;height:18px;border-radius:50%;background:#d7dbef;display:block}
.dots i.ok{background:var(--green)}.dots i.ko{background:var(--orange)}.dots i.cur{outline:3px solid var(--pink)}
.qprompt{font-size:30px;font-weight:900;line-height:1.35}
.qvis{margin:14px 0;display:flex;justify-content:center;flex-wrap:wrap;gap:14px;align-items:center}
.ans{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:28px;font-weight:900;margin-top:8px}
.ans input{width:110px;font-size:32px;font-weight:900;text-align:center;padding:6px;border-radius:12px;border:3px solid #9aa3d6;font-family:inherit;color:var(--paperInk)}
.ans input.bad{border-color:#ff6b3d;background:#fff1ea}
.ans input.good{border-color:var(--green);background:#eafff2}
.choices{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px}
.choice{background:#eef0fb;color:var(--paperInk);padding:14px 22px;border-radius:14px;font-weight:900;font-size:26px;border:3px solid #c9cdeb}
.choice.good{background:#d9fbe8;border-color:var(--green)}.choice.bad{background:#ffe7dc;border-color:#ff6b3d}
.fb{margin-top:16px;border-radius:16px;padding:14px 18px;font-size:22px;line-height:1.45;display:none}
.fb.show{display:block}
.fb.good{background:#e3fbee;border:3px solid var(--green)}
.fb.mid{background:#fff6dc;border:3px solid #f4c430}
.fb.bad{background:#ffeee6;border:3px solid #ff8a5b}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px;align-items:center}
.ready{background:linear-gradient(135deg,#ffe46b,#ffb547);color:#3a2300;border-radius:20px;padding:18px 22px;font-size:26px;font-weight:900;text-align:center;margin-top:8px}
.ready .big{font-size:40px;display:block}
.exo{margin-top:14px}
.exbtn{width:100%;text-align:left;background:linear-gradient(135deg,#2bb3ff,#5b6cff);color:#fff;font-weight:900;font-size:26px;padding:16px 20px;border-radius:18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.exbtn .badge{font-size:15px}
.exbody{display:none;margin-top:12px}
.exbody.show{display:block}
.write{font-size:26px;font-weight:900;text-align:center;padding:10px}
.corr{display:none;margin-top:12px}
.corr.show{display:block;animation:pop .35s}
@keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
.srow{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.mini{background:#eef0fb;color:#4b5280;font-size:16px;font-weight:800;padding:6px 12px;border-radius:10px;border:2px solid #c9cdeb}
.cstep{border-top:2px dashed #d7dbef;padding:14px 0;animation:pop .35s}
.srow+.cstep{border-top:0}
.cq{font-size:26px;font-weight:900;display:flex;gap:12px;align-items:flex-start}
.lt{flex:none;display:inline-block;width:44px;height:44px;line-height:44px;text-align:center;border-radius:50%;background:#d6177a;color:#fff;font-family:"Baloo 2";font-size:28px}
.cact{margin:12px 0 0 56px;font-size:22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.cdone{display:none;margin-top:12px;background:linear-gradient(135deg,#ffe46b,#ffb547);color:#3a2300;border-radius:16px;padding:14px;text-align:center;font-size:26px;font-weight:900}
.cgrid{display:flex;flex-wrap:wrap;gap:16px;justify-content:center}
.ccard{background:#fff;border:2px solid #e3e6f5;border-radius:16px;padding:12px;text-align:center;min-width:170px}
.digital{font-family:"Courier New",monospace;font-weight:900;font-size:30px;background:#1d1d2e;color:#ff4fa3;padding:4px 12px;border-radius:8px;display:inline-block;letter-spacing:2px}
.note{font-size:18px;color:#4b5280;margin-top:6px}
table.ct{border-collapse:collapse;width:100%;font-size:22px}
table.ct td{padding:8px 10px;border-bottom:1px solid #e5e7f3}
.pk{color:#d6177a;font-weight:900}
.bl{color:#1d4ed8;font-weight:900}
.key{display:inline-block;background:#1d2768;color:#fff;padding:8px 16px;border-radius:12px;font-weight:900;font-size:24px}
.seq{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:28px;font-weight:900}
.seq .t{background:#eef0fb;padding:6px 14px;border-radius:12px}
.seq .q{background:#ffe1f0;color:#d6177a;padding:6px 18px;border-radius:12px}
.jl{width:100%;height:auto;display:block;margin:6px auto}
.lineq{margin:10px 0 18px}
.lineq b.qn{display:inline-block;background:#d6177a;color:#fff;border-radius:50%;width:34px;height:34px;text-align:center;line-height:34px;margin-right:6px}
.clkset{display:flex;gap:24px;align-items:center;flex-wrap:wrap;justify-content:center}
.clkbtns{display:grid;grid-template-columns:repeat(2,auto);gap:10px}
.clkbtns button{background:#eef0fb;color:var(--paperInk);font-weight:900;padding:10px 16px;border-radius:12px;border:2px solid #c9cdeb;font-size:22px}
.clkbtns .lab{grid-column:1/3;font-size:18px;font-weight:900;color:#4b5280;text-align:center}
.tag{display:inline-block;background:#1d2768;color:#fff;font-size:20px;padding:4px 12px;border-radius:10px;vertical-align:middle}
.win{color:#0a7a3e}
.mascot{animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px)}}
.small{font-size:18px;color:var(--muted)}
@media(max-width:800px){.hero{grid-template-columns:1fr}.planets{grid-template-columns:1fr}.bubble:before{display:none}}
</style>
</head>
<body>
<div class="stars"></div>
<main>
 <div class="top">
  <div class="logo" onclick="go('home')">
   <svg width="58" height="58" viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="#ffd23f"/><circle cx="50" cy="50" r="34" fill="#fffdf6"/><line x1="50" y1="50" x2="50" y2="26" stroke="#2fd67b" stroke-width="6" stroke-linecap="round"/><line x1="50" y1="50" x2="66" y2="58" stroke="#3b82f6" stroke-width="7" stroke-linecap="round"/><circle cx="50" cy="50" r="5" fill="#1e2440"/></svg>
   <div><h1>Académie Chronos</h1><small>Mission : maîtriser le temps et les durées</small></div>
  </div>
  <div class="tabs" id="tabs"></div>
  <button class="toggle" onclick="toggleBadges()" title="Afficher / masquer niveaux et codes">🏷️ Codes</button>
 </div>
 <div id="view"></div>
</main>

<script>
/* ===================== OUTILS ===================== */
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const p2=n=>String(n).padStart(2,'0');
const fr=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g,' ');
function T(sec,ws){sec=((sec%86400)+86400)%86400;const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;
 if(ws){if(m===0&&s===0)return h+' h';if(s===0)return h+' h '+p2(m)+' min';return h+' h '+p2(m)+' min '+p2(s)+' s';}
 return m===0?h+' h':h+' h '+p2(m);}
function D(sec){const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;const p=[];if(h)p.push(h+' h');if(m)p.push(m+' min');if(s)p.push(s+' s');return p.length?p.join(' '):'0 s';}
const HMS=(h,m,s)=>h*3600+m*60+(s||0);

/* Horloge : petite aiguille bleue (heures), grande aiguille verte (minutes), comme dans le fichier */
function clock(h,m,o={}){const sz=o.size||170;let s=`<svg viewBox="0 0 200 200" width="${sz}" height="${sz}">`;
 s+=`<circle cx="100" cy="100" r="94" fill="#fff" stroke="#1e2440" stroke-width="5"/>`;
 for(let i=0;i<60;i++){const a=i*6*Math.PI/180,r1=i%5?84:76,r2=89;s+=`<line x1="${100+r1*Math.sin(a)}" y1="${100-r1*Math.cos(a)}" x2="${100+r2*Math.sin(a)}" y2="${100-r2*Math.cos(a)}" stroke="#1e2440" stroke-width="${i%5?1.5:3.5}"/>`;}
 for(let n=1;n<=12;n++){const a=n*30*Math.PI/180;s+=`<text x="${100+63*Math.sin(a)}" y="${100-63*Math.cos(a)+7}" font-size="20" font-weight="800" text-anchor="middle" fill="#1e2440" font-family="Nunito">${n}</text>`;}
 if(o.hands!==false){const ah=((h%12)+m/60)*30*Math.PI/180,am=m*6*Math.PI/180;
  s+=`<line x1="100" y1="100" x2="${100+46*Math.sin(ah)}" y2="${100-46*Math.cos(ah)}" stroke="#2563eb" stroke-width="9" stroke-linecap="round"/>`;
  s+=`<line x1="100" y1="100" x2="${100+72*Math.sin(am)}" y2="${100-72*Math.cos(am)}" stroke="#16a34a" stroke-width="6" stroke-linecap="round"/>`;}
 s+=`<circle cx="100" cy="100" r="7" fill="#1e2440"/></svg>`;return s;}
/* Cadran colorié pour les fractions d'heure */
function pie(f,col,sz){sz=sz||120;let s=`<svg viewBox="0 0 200 200" width="${sz}" height="${sz}"><circle cx="100" cy="100" r="92" fill="#fff" stroke="#1e2440" stroke-width="5"/>`;
 if(f>=1)s+=`<circle cx="100" cy="100" r="90" fill="${col}"/>`;else if(f>0){const a=f*2*Math.PI,x=100+90*Math.sin(a),y=100-90*Math.cos(a);s+=`<path d="M100 100 L100 10 A90 90 0 ${f>.5?1:0} 1 ${x} ${y} Z" fill="${col}"/>`;}
 for(let i=0;i<12;i++){const a=i*30*Math.PI/180;s+=`<line x1="${100+80*Math.sin(a)}" y1="${100-80*Math.cos(a)}" x2="${100+90*Math.sin(a)}" y2="${100-90*Math.cos(a)}" stroke="#1e2440" stroke-width="3"/>`;}
 s+=`<circle cx="100" cy="100" r="5" fill="#1e2440"/></svg>`;return s;}
/* Ligne du temps avec des bonds (sauts) */
function jl(pts,jumps,total,o={}){const n=pts.length,gap=o.gap||190,mx=95,W=mx*2+gap*(n-1),y=total?175:120,H=y+(o.alt?95:70);
 let s=`<svg class="jl" viewBox="0 0 ${W} ${H}" style="max-width:${W}px">`;
 s+=`<line x1="20" y1="${y}" x2="${W-20}" y2="${y}" stroke="#1e2440" stroke-width="3"/><polygon points="${W-20},${y-8} ${W-4},${y} ${W-20},${y+8}" fill="#1e2440"/>`;
 if(total){const x1=mx,x2=mx+gap*(n-1);s+=`<path d="M${x1} ${y-14} L${x1} ${y-105} L${x2} ${y-105} L${x2} ${y-14}" fill="none" stroke="#2563eb" stroke-width="4" stroke-linejoin="round"/>`;
  s+=`<rect x="${(x1+x2)/2-115}" y="${y-140}" width="230" height="38" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="${(x1+x2)/2}" y="${y-113}" text-anchor="middle" font-size="22" font-weight="900" fill="#1d4ed8" font-family="Nunito">Durée : ${total}</text>`;}
 for(let i=0;i<n;i++){const x=mx+gap*i;s+=`<line x1="${x}" y1="${y-10}" x2="${x}" y2="${y+10}" stroke="#1e2440" stroke-width="3"/>`;
  const ly=y+34+(o.alt&&i%2?28:0);s+=`<text x="${x}" y="${ly}" text-anchor="middle" font-size="19" font-weight="800" fill="#1e2440" font-family="Nunito">${pts[i]}</text>`;}
 for(let i=0;i<jumps.length;i++){const x1=mx+gap*i,x2=x1+gap;s+=`<path d="M${x1+4} ${y-4} Q ${(x1+x2)/2} ${y-78} ${x2-4} ${y-4}" fill="none" stroke="#d6177a" stroke-width="3.5"/><polygon points="${x2-4},${y-4} ${x2-16},${y-14} ${x2-6},${y-18}" fill="#d6177a"/>`;
  s+=`<text x="${(x1+x2)/2}" y="${y-48}" text-anchor="middle" font-size="20" font-weight="900" fill="#d6177a" font-family="Nunito">+ ${jumps[i]}</text>`;}
 return s+'</svg>';}
/* Bonds pour ajouter une durée : heures, puis minutes, puis secondes (arrêt sur l'heure ou la minute ronde si utile) */
function addJumps(start,dur){const J=[];let cur=start;const h=Math.floor(dur/3600),m=Math.floor(dur%3600/60),s=dur%60;
 if(h){J.push(h*3600);cur+=h*3600;}
 if(m){const r=cur%3600;if(cur%60===0&&r!==0&&r+m*60>3600){const a=3600-r;J.push(a,m*60-a);}else J.push(m*60);cur+=m*60;}
 if(s){const r=cur%60;if(r!==0&&r+s>60){const a=60-r;J.push(a,s-a);}else J.push(s);cur+=s;}
 return J;}
/* Bonds pour trouver une durée entre deux instants : minute ronde, heure ronde, heures, minutes, secondes */
function durJumps(a,b){const J=[];let cur=a;
 if(cur%60&&Math.floor(cur/60)<Math.floor(b/60)){const j=60-cur%60;J.push(j);cur+=j;}
 if(cur%3600&&Math.floor(cur/3600)<Math.floor(b/3600)){const j=3600-cur%3600;J.push(j);cur+=j;}
 let r=b-cur;const h=Math.floor(r/3600);if(h){J.push(h*3600);cur+=h*3600;}
 r=b-cur;const m=Math.floor(r/60);if(m){J.push(m*60);cur+=m*60;}
 if(b-cur)J.push(b-cur);return J;}
function lineT(start,J,ws,total,o){const pts=[T(start,ws)];let c=start;J.forEach(j=>{c+=j;pts.push(T(c,ws));});return jl(pts,J.map(D),total,Object.assign({alt:ws&&J.length>2},o||{}));}
const sumTxt=J=>J.map(D).join(' + ');

/* ===================== GÉNÉRATEURS D'ENTRAÎNEMENT ===================== */
const G={};
G.lire=()=>{const H=ri(6,23),m=Math.random()<.5?ri(0,11)*5:ri(0,59),h12=H%12===0?12:H%12;
 const mo=H<12?'MATIN':H<18?'APRÈS-MIDI':'SOIR';
 let ex=`🔵 La <b>petite aiguille</b> (heures) a dépassé le <b>${h12}</b> → ${h12} h.<br>🟢 La <b>grande aiguille</b> (minutes) indique <b>${m} min</b>`+(m%5===0&&m?` (elle est sur le ${m/5} : ${m/5} × 5 = ${m}).`:'.');
 if(H>12)ex+=`<br>🌙 C'est ${mo==='SOIR'?'le soir':"l'après-midi"} : ${h12} + 12 = <b>${H} h</b>.`;else if(H===12)ex+=`<br>☀️ C'est midi : <b>12 h</b>.`;
 return {prompt:`Quelle heure est-il ? <span class="tag">${mo}</span>`,vis:clock(h12,m,{size:210}),fields:[{ans:H,u:'h'},{ans:m,u:'min'}],explain:ex+`<br>➡️ Il est <b>${H} h ${p2(m)}</b>.`};};
G.frac=()=>{const F=[['¼',.25,15,'#ff9f43'],['½',.5,30,'#a78bfa'],['¾',.75,45,'#2fd67b']];const f=pick(F),t=ri(0,2);
 const base=`1 h = 60 min. On partage l'heure en 4 : 60 ÷ 4 = <b>15 min</b> pour ¼ d'heure.`;

let S=null;
function startTrain(lid,mi){const L=LEVELS.find(x=>x.id==lid),M=L.missions[mi];const qs=[],seen=new Set();let g=0;
 while(qs.length<5&&g<60){g++;const q=G[M.gen]();const k=q.prompt+(q.vis||'');if(seen.has(k))continue;seen.add(k);qs.push(q);}
 S={L,M,mi,qs,i:0,tries:0,res:[],clk:{h:12,m:0}};showQ();}
function showQ(){const q=S.qs[S.i];S.tries=0;S.clk={h:12,m:0};
 let body=`<div class="paper"><div class="qtop"><div class="dots">${S.qs.map((_,k)=>`<i class="${S.res[k]===true?'ok':S.res[k]===false?'ko':''} ${k===S.i?'cur':''}"></i>`).join('')}</div><div class="small" style="color:#4b5280">Question ${S.i+1} / 5</div></div>
 <div class="qprompt">${q.prompt}</div>`;
 if(q.type==='clock')body+=`<div class="qvis clkset"><div id="clkv">${clock(12,0,{size:230})}</div><div class="clkbtns"><div class="lab">🔵 Heures</div><button onclick="clkMove(-60)">− 1 h</button><button onclick="clkMove(60)">+ 1 h</button><div class="lab">🟢 Minutes</div><button onclick="clkMove(-5)">− 5 min</button><button onclick="clkMove(5)">+ 5 min</button><button onclick="clkMove(-1)">− 1 min</button><button onclick="clkMove(1)">+ 1 min</button></div></div>`;
 else if(q.vis)body+=`<div class="qvis">${q.vis}</div>`;
 if(q.fields)body+=`<div class="ans">${q.fields.map((f,k)=>`<input inputmode="numeric" autocomplete="off" id="in${k}"> <span>${f.u}</span>`).join(' ')}</div>`;
 if(q.choices)body+=`<div class="choices">${q.choices.map((c,k)=>`<button class="choice" id="ch${k}" onclick="pickChoice(${k})">${c}</button>`).join('')}</div>`;
 body+=`<div class="row">${q.choices?'':`<button class="go" id="vbtn" onclick="check()">✔ Vérifier</button>`}<button class="go alt" id="nbtn" style="display:none" onclick="nextQ()">Suivant ➜</button></div><div class="fb" id="fb"></div></div>`;
 document.getElementById('train').innerHTML=body;
 const i0=document.getElementById('in0');if(i0){i0.focus();document.querySelectorAll('.ans input').forEach((el,k,all)=>el.addEventListener('keydown',e=>{if(e.key==='Enter'){if(k<all.length-1&&!all[k+1].value)all[k+1].focus();else check();}}));}}
function clkMove(d){let t=(S.clk.h%12)*60+S.clk.m+d;t=((t%720)+720)%720;S.clk={h:Math.floor(t/60)||12,m:t%60};document.getElementById('clkv').innerHTML=clock(S.clk.h,S.clk.m,{size:230});}
function pickChoice(k){if(document.getElementById('nbtn').style.display!=='none')return;check(k);}
function check(choice){const q=S.qs[S.i];let ok;
 if(q.type==='clock')ok=(S.clk.h%12)===(q.target.h%12)&&S.clk.m===q.target.m;
 else if(q.choices)ok=choice===q.ans;
 else{const ins=[...document.querySelectorAll('.ans input')];if(ins.some(x=>x.value.trim()===''))return;
  const r=q.fields.map((f,k)=>Number(ins[k].value.replace(',','.').trim())===f.ans);ok=r.every(Boolean);ins.forEach((x,k)=>{x.classList.remove('bad','good');x.classList.add(r[k]?'good':'bad')});}
 const fb=document.getElementById('fb');S.tries++;
 if(q.choices){const b=document.getElementById('ch'+choice);b.classList.add(ok?'good':'bad');}
 if(ok){if(q.choices)document.getElementById('ch'+q.ans).classList.add('good');fb.className='fb show good';fb.innerHTML=`<b>✅ ${pick(['Mission réussie !','Bravo, cadet !','Parfait, la fusée avance !','Super pilotage !'])}</b><br>${q.explain}`;finishQ(S.tries===1);return;}
 if(S.tries<2){fb.className='fb show mid';fb.innerHTML=`<b>🛰️ Presque ! Vérifie et réessaie.</b>`+(q.choices?'':'');if(q.choices)setTimeout(()=>document.getElementById('ch'+choice).classList.remove('bad'),900);return;}
 if(q.choices)document.getElementById('ch'+q.ans).classList.add('good');
 if(q.type==='clock')document.getElementById('clkv').innerHTML=clock(q.target.h,q.target.m,{size:230});
 const sol=q.fields?q.fields.map(f=>`${f.ans} ${f.u}`).join(' '):q.choices?q.choices[q.ans]:'';
 fb.className='fb show bad';fb.innerHTML=`<b>🔧 La bonne réponse${sol?' : '+sol:''}.</b> On regarde ensemble :<br>${q.explain}`;finishQ(false);}

 const sc=S.res.filter(Boolean).length,st=sc>=5?3:sc>=3?2:1,key=S.L.id+'-'+S.mi;stars[key]=Math.max(stars[key]||0,st);saveStars();
 document.getElementById('train').innerHTML=`<div class="ready"><span class="big">${'⭐'.repeat(st)}</span>${sc} / 5 réussies du premier coup !<br><br>🚀 Maintenant, tu peux faire ${S.M.ex.map(REF).join(' et ')}.</div>
 <div class="row" style="justify-content:center">${S.M.ex.map((e,k)=>`<button class="go alt" onclick="openEx(${k});document.getElementById('ex${k}').scrollIntoView({behavior:'smooth'})">📘 Exercice n°${e.n} — fiche ${e.f}</button>`).join('')}<button class="go" onclick="startTrain(${S.L.id},${S.mi})">🔁 Nouvel entraînement</button></div>`;}
