<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>L'Atelier des fractions</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;800&display=swap">
<style>
/* Layout: atelier de pâtisserie — vitrine d'onglets, plan de travail blanc, toques et macarons comme récompenses, escalier des problèmes. Univers unique (clair, gourmand). */
:root{
  --bg:#FFEFF4; --dot:#FFD9E5; --panel:#FFFFFF; --ink:#3B2630; --muted:#7A6170;
  --straw:#F2557A; --straw-soft:#FFE1EA; --pista:#5DB075; --pista-soft:#E2F5E7;
  --blue:#5B7BE0; --blue-soft:#E6ECFF; --butter:#FFD166; --butter-soft:#FFF4D6;
  --choco:#7B4A2E; --line:#F0D6DF; --ko:#D64545; --ko-soft:#FDE6E6;
  --title:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --text:"Andika","Comic Sans MS","Trebuchet MS",system-ui,sans-serif;
  color-scheme:light;
}
body{background:var(--bg);color:var(--ink);font-family:var(--text);font-size:19px;line-height:1.5;
  background-image:radial-gradient(var(--dot) 2.5px,transparent 2.6px);background-size:28px 28px}
.wrap{max-width:900px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 60px;display:flex;flex-direction:column;gap:16px}
header{display:flex;align-items:center;gap:12px}
header .chef{width:74px;height:74px;flex:none}
h1{font-family:var(--title);font-weight:800;font-size:2rem;line-height:1.05;margin:0;text-wrap:balance}
h1 span{color:var(--straw)}
header p{margin:0;color:var(--muted);font-size:1rem}
@media (max-width:520px){h1{font-size:1.55rem}header .chef{width:58px;height:58px}}
nav{display:flex;flex-wrap:wrap;gap:8px}
.tab{font-family:var(--title);font-weight:800;font-size:1rem;border:3px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer;display:flex;align-items:center;gap:6px}
.tab .code{font-family:var(--text);font-size:.8rem;background:var(--straw-soft);color:var(--straw);border-radius:999px;padding:0 8px}
.tab.on{background:var(--straw);border-color:var(--straw);color:#fff}
.tab.on .code{background:#fff}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.card{background:var(--panel);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 6px 0 var(--line)}
.card h2{font-family:var(--title);font-weight:800;font-size:1.5rem;margin:0;line-height:1.1}
.comp{display:flex;gap:12px;align-items:flex-start;background:var(--butter-soft);border-radius:18px;padding:12px 14px}
.comp .badge{font-family:var(--title);font-weight:800;background:var(--butter);border-radius:12px;padding:2px 10px;flex:none}
.comp p{margin:0}
.comp .ex{color:var(--muted);font-size:1rem}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:560px){.levels{grid-template-columns:1fr}}
.lvl{font-family:var(--title);font-weight:800;font-size:1.05rem;text-align:left;border:3px solid var(--line);background:var(--panel);color:var(--ink);border-radius:18px;padding:8px 12px;cursor:pointer;display:flex;align-items:center;gap:10px}
.lvl svg{width:38px;height:30px;flex:none}
.lvl small{display:block;font-family:var(--text);font-weight:400;font-size:.85rem;color:var(--muted)}
.lvl.on{border-color:var(--blue);background:var(--blue-soft)}
.btn{font-family:var(--title);font-weight:800;font-size:1.1rem;border:none;border-radius:16px;padding:10px 20px;cursor:pointer;color:#fff;background:var(--straw);box-shadow:0 4px 0 #C93A5E}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #C93A5E}
.btn.green{background:var(--pista);box-shadow:0 4px 0 #3F8C57}
.btn.soft{background:var(--blue-soft);color:var(--ink);box-shadow:0 4px 0 #C6D2F7}
.btn.small{font-size:.95rem;padding:6px 12px;border-radius:12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.dots{display:flex;gap:6px}
.dots i{flex:1;height:10px;border-radius:5px;background:var(--line)}
.dots i.ok{background:var(--pista)} .dots i.no{background:var(--butter)} .dots i.cur{background:var(--blue)}
.story{margin:0;font-size:1.15rem}
.visual{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;background:#FFF8FB;border-radius:18px;padding:12px}
.visual svg{max-width:100%;height:auto}
.steps{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.steps li{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font-size:1.15rem}
.steps .n{font-family:var(--title);font-weight:800;background:var(--blue);color:#fff;border-radius:50%;width:28px;height:28px;display:inline-grid;place-items:center;font-size:.95rem;flex:none}
.big{font-size:1.6rem;display:flex;flex-wrap:wrap;align-items:center;gap:8px;justify-content:center;font-weight:700}
/* fractions */
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.1;font-weight:700;margin:0 2px}
.fr>span:first-child,.fr>input:first-child{border-bottom:3px solid currentColor;padding:0 4px 2px}
.fr>span:last-child,.fr>input:last-child{padding:2px 4px 0}
.fin{gap:4px}.fin>input:first-child{border-bottom:2px dotted var(--muted)}
/* pointillés */
input.dot{font-family:var(--text);font-weight:700;font-size:1.25rem;width:2.6em;text-align:center;border:none;border-bottom:3px dotted var(--muted);background:var(--butter-soft);border-radius:8px 8px 0 0;color:var(--ink);padding:2px 0}
input.dot.ok{background:var(--pista-soft);border-bottom-color:var(--pista);color:#1E6B39}
input.dot.ko{background:var(--ko-soft);border-bottom-color:var(--ko)}
.sg{display:inline-flex;gap:4px;border-radius:12px;padding:3px}
.sg button,.choices button{font-family:var(--title);font-weight:800;font-size:1.2rem;border:3px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;min-width:46px;padding:4px 10px;cursor:pointer}
.sg button.sel,.choices button.sel{border-color:var(--blue);background:var(--blue-soft)}
.sg.ok button.sel,.choices.ok button.sel{border-color:var(--pista);background:var(--pista-soft)}
.sg.ko button.sel,.choices.ko button.sel{border-color:var(--ko);background:var(--ko-soft)}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.choices button{font-size:1.05rem}
.fb{margin:0;border-radius:14px;padding:10px 14px;font-size:1.05rem}
.fb.good{background:var(--pista-soft);color:#1E6B39}
.fb.try{background:var(--butter-soft);color:#7A5300}
.fb.show{background:var(--blue-soft);color:#2B3F8F}
.fb b{font-weight:700}
.result{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.score{font-family:var(--title);font-weight:800;font-size:3.2rem;line-height:1;font-variant-numeric:tabular-nums}
.result svg.mac{width:80px;height:64px}
.chart{display:flex;align-items:flex-end;gap:10px;height:120px;border-bottom:4px solid var(--line);padding-top:6px;width:100%;max-width:420px}
.bar{flex:1;max-width:44px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;height:100%}
.bar i{display:block;width:100%;border-radius:10px 10px 3px 3px;background:var(--straw-soft);min-height:6px}
.bar.last i{background:var(--straw)} .bar.full i{background:var(--pista)}
.bar span{font-family:var(--title);font-weight:800;font-size:.95rem}
/* carnet */
.book{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (max-width:620px){.book{grid-template-columns:1fr}}
.page{border:3px solid var(--line);border-radius:20px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;background:#fff;min-width:0}
.page h3{font-family:var(--title);font-weight:800;font-size:1.15rem;margin:0;display:flex;gap:8px;align-items:center}
.page h3 .code{font-family:var(--text);font-size:.8rem;background:var(--straw-soft);color:var(--straw);border-radius:999px;padding:0 8px}
.macs{display:flex;gap:10px;flex-wrap:wrap}
.macs div{display:flex;flex-direction:column;align-items:center;font-size:.85rem;color:var(--muted)}
.macs svg{width:46px;height:36px}
.note{color:var(--muted);font-size:1rem;margin:0}
/* escalier */
.stairs svg{width:100%;max-width:560px;height:auto;display:block;margin:0 auto}
.stairs g.step{cursor:pointer}
.ptag{display:inline-block;font-size:.85rem;background:var(--straw-soft);color:var(--straw);border-radius:999px;padding:0 10px;font-weight:700}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:20}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
@media (prefers-reduced-motion:no-preference){.card{animation:pop .25s ease-out}@keyframes pop{from{transform:translateY(6px)}to{transform:none}}}
.qbox{display:flex;flex-direction:column;gap:12px}
.manip{display:flex;flex-direction:column;gap:10px;background:#FFF8FB;border-radius:18px;padding:12px}
.mtip{margin:0;font-weight:700;color:var(--choco)}
.plates{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.plate{border:3px dashed transparent;background:none;border-radius:16px;padding:2px;cursor:default}
.plate.cuttable{cursor:pointer;border-color:var(--straw)}
.plate.cuttable:hover{background:var(--straw-soft)}
.plate svg{display:block;max-width:100%;height:auto}
.tray{display:flex;flex-direction:column;gap:6px;background:#F3E6DA;border-radius:14px;padding:8px;min-height:52px}
.grp{display:flex;flex-wrap:wrap;gap:4px}
.piece{width:40px;height:40px;border:none;background:#fff;border-radius:10px;padding:4px;cursor:pointer;box-shadow:0 2px 0 #D8C2B2}
.piece svg{width:100%;height:100%}
.verif{margin:0;font-size:1.1rem;background:var(--blue-soft);border-radius:12px;padding:8px 12px}
.why{display:block;margin-top:4px;font-weight:700}
.pouce{margin:8px 0 0;padding-left:1.4em;display:flex;flex-direction:column;gap:4px}
.listen{white-space:nowrap}
</style>

</head>
<body>
<canvas id="confetti" hidden></canvas>
<div class="wrap">
  <header>
    <span id="hdrChef"></span>
    <div><h1>L'Atelier <span>des fractions</span></h1><p>Décomposer, recomposer, encadrer… comme un vrai pâtissier !</p></div>
  </header>
  <nav id="nav" aria-label="Onglets"></nav>
  <main id="main"></main>
</div>

<script>
// ================= OUTILS =================
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pl=(n,s,p)=>n>1?p:s;
const F=(n,d)=>`<span class="fr"><span>${n}</span><span>${d}</span></span>`;
const inp=(a,role="",label="réponse")=>`<input class="dot" inputmode="numeric" autocomplete="off" data-ans="${a}" data-role="${role}" aria-label="${label}">`;
const finp=(n,d,role="f")=>`<span class="fr fin" data-n="${n}" data-d="${d}" data-role="${role}"><input class="dot" inputmode="numeric" autocomplete="off" aria-label="numérateur"><input class="dot" inputmode="numeric" autocomplete="off" aria-label="dénominateur"></span>`;
const fnum=(n,d,role="fn")=>`<span class="fr"><span>${inp(n,role,"numérateur")}</span><span>${d}</span></span>`;
const sg=a=>`<span class="sg" data-ans="${a}"><button data-v="&lt;" aria-label="plus petit que">&lt;</button><button data-v="=" aria-label="égal à">=</button><button data-v="&gt;" aria-label="plus grand que">&gt;</button></span>`;
const choices=(opts,ok,role="c")=>`<div class="choices" data-ans="${ok}" data-role="${role}">${opts.map((o,k)=>`<button data-v="${k}">${o}</button>`).join("")}</div>`;
const LT="&lt;",GT="&gt;",sym=t=>t==="<"?LT:t===">"?GT:"=";

// ================= DESSINS =================
// ================= DESSINS =================
function pizza(den,filled){
  let s=`<svg viewBox="0 0 100 100" width="104" height="104" aria-hidden="true"><circle cx="50" cy="50" r="48" fill="#E9A65A"/><circle cx="50" cy="50" r="42" fill="#FFF7EE"/>`;
  for(let i=0;i<den;i++){
    const a0=(-90+i*360/den)*Math.PI/180,a1=(-90+(i+1)*360/den)*Math.PI/180,am=(a0+a1)/2;
    const x0=50+42*Math.cos(a0),y0=50+42*Math.sin(a0),x1=50+42*Math.cos(a1),y1=50+42*Math.sin(a1);
    const on=i<filled;
    s+=`<path d="M50 50 L${x0.toFixed(2)} ${y0.toFixed(2)} A42 42 0 ${den===1?1:0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)} Z" fill="${on?"#FFC94D":"#FFF7EE"}" stroke="#C9803A" stroke-width="1.5"/>`;
    if(on){s+=`<circle cx="${(50+26*Math.cos(am)).toFixed(1)}" cy="${(50+26*Math.sin(am)).toFixed(1)}" r="${den>6?4:6}" fill="#D9483B"/>`;
      if(den<=6)s+=`<circle cx="${(50+14*Math.cos(am+.3)).toFixed(1)}" cy="${(50+14*Math.sin(am+.3)).toFixed(1)}" r="3" fill="#5DB075"/>`;}
  }
  return s+`</svg>`;
}
const CHOCO={2:[2,1],3:[3,1],4:[4,1],5:[5,1],6:[3,2],7:[7,1],8:[4,2],9:[3,3],10:[5,2],12:[4,3]};
function choco(den,filled){
  const [c,r]=CHOCO[den]||[den,1],S=22,P=5,w=c*S+2*P,h=r*S+2*P;
  let s=`<svg viewBox="0 0 ${w} ${h}" width="${w*1.25}" height="${h*1.25}" aria-hidden="true"><rect x="0" y="0" width="${w}" height="${h}" rx="5" fill="#E9D3C3"/>`;
  for(let k=0;k<den;k++){const x=P+(k%c)*S,y=P+Math.floor(k/c)*S,on=k<filled;
    s+=`<rect x="${x+1}" y="${y+1}" width="${S-2}" height="${S-2}" rx="3" fill="${on?"#7B4A2E":"#FBF3EE"}" stroke="${on?"#5A321C":"#C9A890"}" ${on?"":'stroke-dasharray="3 2"'}/>`;
    if(on)s+=`<rect x="${x+4}" y="${y+4}" width="${S-12}" height="4" rx="2" fill="#9C6545"/>`;}
  return s+`</svg>`;
}
const KINDS={pizza:{item:"pizza",items:"pizzas",part:"part",parts:"parts",de:"de pizza",draw:pizza},
             choco:{item:"tablette",items:"tablettes",part:"carré",parts:"carrés",de:"de tablette",draw:choco}};
function kindFor(den){return [2,3,4,6,8].includes(den)&&Math.random()<.55?"pizza":"choco"}
function items(kind,den,num,count){let s="";for(let k=0;k<count;k++)s+=KINDS[kind].draw(den,Math.max(0,Math.min(den,num-k*den)));return `<div class="visual">${s}</div>`}
function strip(den,num,units){
  const W=300,H=26,G=10;let s=`<svg viewBox="0 0 ${W+40} ${units*(H+G)}" width="${W+40}" aria-hidden="true">`;
  for(let u=0;u<units;u++){const y=u*(H+G);
    for(let k=0;k<den;k++){const x=k*W/den,on=u*den+k<num;
      s+=`<rect x="${x+1}" y="${y}" width="${W/den-2}" height="${H}" rx="4" fill="${on?"#F2557A":"#FFF1F5"}" stroke="#E28AA3"/>`;}
    s+=`<text x="${W+8}" y="${y+18}" font-family="Andika,sans-serif" font-size="15" fill="#7A6170">1</text>`;}
  return `<div class="visual">${s}</svg></div><p class="note">Chaque bande = 1 unité, partagée en ${den}.</p>`;
}
function line(den,num,maxInt,label){
  const W=340,P=18,U=(W-2*P)/maxInt,x=P+num/den*U;
  let s=`<svg viewBox="0 0 ${W} 86" width="${W}" aria-hidden="true"><line x1="${P}" y1="56" x2="${W-P}" y2="56" stroke="#3B2630" stroke-width="3"/>`;
  for(let k=0;k<=maxInt*den;k++){const tx=P+k/den*U,big=k%den===0;
    s+=`<line x1="${tx}" y1="${big?44:50}" x2="${tx}" y2="${big?68:62}" stroke="#3B2630" stroke-width="${big?3:1.5}"/>`;
    if(big)s+=`<text x="${tx}" y="84" text-anchor="middle" font-family="Baloo 2,sans-serif" font-weight="800" font-size="16" fill="#3B2630">${k/den}</text>`;}
  s+=`<path d="M${x} 50 q-2 -14 8 -22" stroke="#5DB075" stroke-width="3" fill="none"/><circle cx="${x}" cy="46" r="8" fill="#D9483B"/><circle cx="${x-3}" cy="43" r="2.5" fill="#fff" opacity=".7"/>`;
  if(label)s+=`<text x="${x}" y="18" text-anchor="middle" font-family="Baloo 2,sans-serif" font-weight="800" font-size="15" fill="#F2557A">${label}</text>`;
  return `<div class="visual">${s}</svg></div>`;
}
function chef(){return `<svg class="chef" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="62" r="28" fill="#FFD7B5"/><circle cx="40" cy="60" r="3.5" fill="#3B2630"/><circle cx="60" cy="60" r="3.5" fill="#3B2630"/><path d="M40 72 q10 8 20 0" stroke="#3B2630" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="33" cy="69" r="4" fill="#F2557A" opacity=".4"/><circle cx="67" cy="69" r="4" fill="#F2557A" opacity=".4"/><rect x="28" y="30" width="44" height="12" rx="3" fill="#fff" stroke="#E0C8D2" stroke-width="2"/><circle cx="34" cy="24" r="12" fill="#fff" stroke="#E0C8D2" stroke-width="2"/><circle cx="50" cy="17" r="14" fill="#fff" stroke="#E0C8D2" stroke-width="2"/><circle cx="66" cy="24" r="12" fill="#fff" stroke="#E0C8D2" stroke-width="2"/><rect x="29" y="28" width="42" height="12" fill="#fff"/></svg>`}
const MACC=["#F2557A","#5DB075","#B48CE0"];
function macaron(level,on){const c=on?MACC[level-1]:"#EADDE3";return `<svg class="mac" viewBox="0 0 50 40" aria-hidden="true"><ellipse cx="25" cy="13" rx="20" ry="9" fill="${c}"/><rect x="7" y="16" width="36" height="7" rx="3" fill="${on?"#FFF4D6":"#F6EEF1"}"/><ellipse cx="25" cy="27" rx="20" ry="9" fill="${c}"/>${on?'<ellipse cx="18" cy="10" rx="6" ry="2.5" fill="#fff" opacity=".5"/>':""}</svg>`}
document.getElementById("hdrChef").innerHTML=chef();


function sliceIcon(kind){return kind==="pizza"
  ?`<svg viewBox="0 0 30 30" aria-hidden="true"><path d="M15 28 L3 6 Q15 0 27 6 Z" fill="#FFC94D" stroke="#C9803A" stroke-width="1.5"/><path d="M3 6 Q15 0 27 6" stroke="#E9A65A" stroke-width="4" fill="none"/><circle cx="15" cy="13" r="3.5" fill="#D9483B"/></svg>`
  :`<svg viewBox="0 0 30 30" aria-hidden="true"><rect x="3" y="3" width="24" height="24" rx="4" fill="#7B4A2E" stroke="#5A321C"/><rect x="7" y="7" width="12" height="4" rx="2" fill="#9C6545"/></svg>`}

// ================= MANIPULATION (niveau 1) =================
// fill : ranger des parts en vrac dans des pizzas/tablettes vides. cut : découper des entières pour compter les parts.
function manip(cfg){return `<div class="manip" data-cfg='${JSON.stringify(cfg)}'></div>`}
function initManips(root){root.querySelectorAll(".manip").forEach(el=>{
  const c=JSON.parse(el.dataset.cfg),K=KINDS[c.kind];
  const st=c.mode==="fill"?{plates:Array(c.plates).fill(0),groups:[c.loose]}:{plates:Array(c.whole).fill(c.den),groups:[c.extra]};
  el.state=st;
  el.done=()=>c.mode==="fill"?st.groups[0]===0:st.plates.every(p=>p===0);
  const draw=()=>{
    const tray=st.groups.filter(g=>g>0);
    el.innerHTML=`<p class="mtip">${c.mode==="fill"
        ?(el.done()?`Toutes les ${K.parts} sont rangées. Observe bien !`:`Touche une ${K.part} du plateau pour la ranger dans une ${K.item}.`)
        :(el.done()?`Toutes les ${K.items} sont découpées. Compte les ${K.parts} !`:`Touche une ${K.item} entière pour la découper en ${K.parts}.`)}</p>
      <div class="plates">${st.plates.map((p,k)=>`<button class="plate ${c.mode==="cut"&&p===c.den?"cuttable":""}" data-k="${k}" aria-label="${K.item} ${k+1} : ${p} ${K.parts} sur ${c.den}">${K.draw(c.den,p)}</button>`).join("")}</div>
      <div class="tray" aria-label="Plateau">${tray.length?tray.map(g=>`<div class="grp">${Array.from({length:g},()=>`<button class="piece" aria-label="une ${K.part}">${sliceIcon(c.kind)}</button>`).join("")}</div>`).join(""):`<span class="note">Plateau vide</span>`}</div>
      <div class="row"><button class="btn small soft mreset">Tout remettre</button></div>`;
    el.querySelectorAll(".piece").forEach(b=>b.onclick=()=>{if(c.mode!=="fill")return;
      const k=st.plates.findIndex(p=>p<c.den);if(k<0)return;st.plates[k]++;st.groups[0]--;draw();el.dispatchEvent(new Event("manip",{bubbles:true}))});
    el.querySelectorAll(".plate").forEach(b=>b.onclick=()=>{if(c.mode!=="cut")return;const k=+b.dataset.k;

function diag19(v,num,den,q,r){
  const Q=v.q,R=v.r;
  if(v.f&&v.f.d&&v.f.d!==den&&v.f.n*den!==r*v.f.d)return `Le dénominateur ne change pas : ce sont toujours des parts partagées en ${den}. La fraction restante s'écrit donc sur ${den}.`;
  if(Q===undefined||isNaN(Q)||R===undefined||isNaN(R))return null;
  if(Q===r&&R===q&&q!==r)return `Tu as inversé : le nombre d'unités entières vient d'abord, puis les parts qui restent.`;
  if(R>=den)return `Il te reste ${R} parts : c'est trop ! Avec ${den} parts, on peut encore faire une unité entière. Le reste doit être plus petit que ${den}.`;
  if(Q*den+R!==num)return `Vérifie en recomposant : ${Q} × ${den} + ${R} = ${Q*den+R}, et pas ${num}.`;
  return null;
}
function diag20(v,e,n,den){
  const T=v.fn!==undefined?v.fn:v.f?v.f.n:undefined,D=v.f?v.f.d:den;
  if(v.f&&D&&D!==den&&T*den!==(e*den+n)*D)return `Le dénominateur ne change pas : les parts sont toujours partagées en ${den}.`;
  if(T===undefined||isNaN(T))return null;
  if(T===e+n)return `Attention : tu as ajouté ${e} et ${n}. Mais ${e} ${pl(e,"unité","unités")} = ${e} × ${den} = ${e*den} parts !`;
  if(T===e*den)return `Tu as bien compté les unités entières, mais tu as oublié d'ajouter les ${n} parts en plus.`;
  if(T===n*den+e)return `Tu as multiplié le mauvais nombre : c'est l'entier ${e} qu'il faut multiplier par ${den}, puis on ajoute ${n}.`;
  if(T===e*n)return `Ce n'est pas ${e} × ${n} : chaque unité contient ${den} parts, donc ${e} × ${den}, puis + ${n}.`;
  return null;
}
function diag27(v,num,den,q){
  const Lo=v.lo,Hi=v.hi;if(isNaN(Lo)||isNaN(Hi)||Lo===undefined)return null;
  if(Hi-Lo!==1)return `Les deux nombres doivent se suivre, comme 2 et 3.`;
  if(Lo>q)return `C'est trop grand : ${F(num,den)} ne fait pas encore ${Lo} unités entières.`;
  if(Lo<q)return `C'est trop petit : avec ${num} parts de ${den}, on fait déjà ${q} ${pl(q,"unité entière","unités entières")}.`;
  return null;
}
function diag24(v,num,den,t){
  if(v.c===undefined)return null;const chosen=["<","=",">"][v.c];if(chosen===t)return null;
  if(t==="<")return `${num} parts, c'est moins que les ${den} parts d'une unité entière : la fraction est plus petite que 1.`;
  if(t===">")return `${num} parts, c'est plus que les ${den} parts d'une unité entière : la fraction est plus grande que 1.`;
  return `${num} parts = exactement les ${den} parts d'une unité : la fraction est égale à 1.`;
}

const KEY="atelier-fractions-v1";

const rec=(sk,L)=>{S.sk[sk]=S.sk[sk]||{};S.sk[sk][L]=S.sk[sk][L]||{scores:[]};return S.sk[sk][L]};
const best=(sk,L)=>{const r=S.sk[sk]&&S.sk[sk][L];return r&&r.scores.length?Math.max(...r.scores):null};

// ================= LECTURE À VOIX HAUTE =================
let voice=null;
function pickVoice(){try{const v=speechSynthesis.getVoices().filter(x=>/^fr/i.test(x.lang));
  const sc=x=>(/fr[-_]FR/i.test(x.lang)?5:0)+(/natural|neural|online|premium|enhanced|google/i.test(x.name)?10:0)-(/compact|espeak/i.test(x.name)?10:0);
  voice=v.sort((a,b)=>sc(b)-sc(a))[0]||null}catch(e){}}
try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice}catch(e){}
const ORD={2:"demi",3:"tiers",4:"quart",5:"cinquième",6:"sixième",7:"septième",8:"huitième",9:"neuvième",10:"dixième",12:"douzième",100:"centième"};
function frWords(n,d){const w=ORD[d]||(d+"ième");if(n==="combien")return `combien de ${w==="tiers"?w:w+"s"}`;
  if(+n===1)return (d===2?"un demi":"un "+w);return `${n} ${w==="tiers"||/s$/.test(w)?w:w+"s"}`}
function readText(box){
  const c=box.cloneNode(true);
  c.querySelectorAll("svg,.manip .row,.tray,.mtip").forEach(x=>x.remove());
  c.querySelectorAll(".fin").forEach(x=>x.replaceWith(" combien, sous forme de fraction, "));
  c.querySelectorAll(".fr").forEach(x=>{const a=x.children[0],b=x.children[1];const n=a.querySelector&&a.querySelector("input")?"combien":a.textContent.trim();x.replaceWith(" "+frWords(n,+b.textContent.trim())+" ")});
  c.querySelectorAll("input").forEach(x=>x.replaceWith(" combien "));
  c.querySelectorAll(".sg").forEach(x=>x.replaceWith(" plus petit, égal ou plus grand que "));
  c.querySelectorAll(".choices").forEach(x=>x.replaceWith(" Choisis : "+[...x.querySelectorAll("button")].map(b=>b.textContent).join(", ou ")+". "));
  c.querySelectorAll(".n").forEach(x=>x.replaceWith(" "));
  c.querySelectorAll("li,p").forEach(x=>x.append(". "));
  return c.textContent.replace(/</g," est plus petit que ").replace(/>/g," est plus grand que ").replace(/×/g," fois ").replace(/−/g," moins ").replace(/=/g," égale ").replace(/\s+/g," ").replace(/\s*\.(\s*\.)+/g,". ").replace(/(\?|!)\s*\./g,"$1");
}
function speak(box){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(readText(box));u.lang="fr-FR";u.rate=.9;if(voice)u.voice=voice;speechSynthesis.speak(u)}catch(e){}}
const hush=()=>{try{speechSynthesis.cancel()}catch(e){}};

function renderLevelStart(){

      <button class="btn" id="startS">${r.scores.length?"Recommencer":"Commencer"} le ${LEVELS[level-1][0].toLowerCase()}</button>

function startSeries(){series={qs:SKILLS[view].gen(level),i:0,score:0,res:[],phase:"main",extra:[],ei:0,eok:0};renderQ()}
function curQ(){const s=series;return s.phase==="main"?s.qs[s.i]:s.extra[s.ei]}
function renderQ(){
  const s=series,q=curQ();s.tries=0;s.done=false;
  const main=s.phase==="main";
  document.getElementById("zone").innerHTML=`${main
      ?`<div class="dots" aria-label="Question ${s.i+1} sur ${N}">${s.qs.map((_,j)=>`<i class="${j<s.i?(s.res[j]?"ok":"no"):j===s.i?"cur":""}"></i>`).join("")}</div>
        <div class="row" style="justify-content:space-between"><span class="note">Question ${s.i+1} sur ${N}</span>${listenBtn}</div>`
      :`<p class="fb try" style="margin:0"><b>Je retravaille mes erreurs</b> · question ${s.ei+1} sur ${s.extra.length}. Même type de question, avec d'autres nombres.</p>
        <div class="row" style="justify-content:flex-end">${listenBtn}</div>`}
    <div id="qbox" class="qbox">${q.html}</div>
    <p class="fb" id="fb" hidden></p>
    <div class="row"><button class="btn green" id="chk">Vérifier</button><button class="btn" id="nxt" hidden>Continuer</button></div>`;
  const box=document.getElementById("qbox");
  initManips(box);wire(box,checkQ);
  document.querySelector(".listen").onclick=()=>speak(box);
  document.getElementById("chk").onclick=checkQ;
  document.getElementById("nxt").onclick=nextQ;
}
function nextQ(){hush();const s=series;
  if(s.phase==="main"){s.i++;if(s.i<N)return renderQ();
    const missed=s.qs.map((q,j)=>s.res[j]?null:q).filter(Boolean).slice(0,3);
    if(missed.length){const fresh=SKILLS[view].gen(level);const used=new Set(s.qs.map(q=>q.key));
      s.extra=missed.map(m=>{const c=fresh.find(f=>f.type===m.type&&!used.has(f.key))||fresh.find(f=>!used.has(f.key))||fresh[0];used.add(c.key);return c});
      s.phase="extra";s.ei=0;return renderQ();}
    return endSeries();}
  s.ei++;s.ei<s.extra.length?renderQ():endSeries();
}
function checkQ(){
  const s=series;if(s.done)return;const q=curQ(),box=document.getElementById("qbox"),fb=document.getElementById("fb");
  if(q.manip){const m=box.querySelector(".manip");if(m&&!m.done()){fb.hidden=false;fb.className="fb try";
    fb.innerHTML=`<b>Commence par manipuler !</b> ${m.querySelector(".mtip").textContent}`;return}}
  fb.hidden=false;if(incomplete(box)){fb.className="fb try";fb.innerHTML=EMPTY;return}
  const ok=check(box);s.tries++;
  const main=s.phase==="main";
  if(ok){s.done=true;if(main){if(s.tries===1)s.score++;s.res[s.i]=s.tries===1}else s.eok++;
    fb.className="fb good";fb.innerHTML=`<b>${pick(["Bravo !","Super !","Excellent !","C'est ça !"])}</b>${s.tries>1?" Tu as bien corrigé.":""} ${q.explain}`;lock(box);finishBtns();}
  else if(s.tries===1){const d=q.diag?q.diag(values(box)):null;
    fb.className="fb try";fb.innerHTML=`<b>Presque !</b> Regarde les cases en rouge. ${d?`<span class="why">${d}</span>`:`Petite aide : ${q.hint}`}`;}
  else{s.done=true;if(main)s.res[s.i]=false;reveal(box);fb.className="fb show";fb.innerHTML=`<b>Voici la réponse :</b> ${q.explain} ${main?"Tu pourras la retravailler à la fin de la série.":"Continue, tu progresses !"}`;finishBtns();}
}
function finishBtns(){document.getElementById("chk").hidden=true;const n=document.getElementById("nxt");n.hidden=false;n.focus({preventScroll:true})}
function endSeries(){
  const s=series,r=rec(view,level),prev=r.scores.length?r.scores[r.scores.length-1]:null,wasEarned=earned(view,level);
  r.scores.push(s.score);save();
  const got=s.score>=5;
  let msg;
  if(s.score===6)msg="Parfait, 6 sur 6 ! Tu es un vrai chef pâtissier.";
  else if(got)msg="Bravo, tu as gagné le macaron de ce niveau !";
  else if(prev!==null&&s.score>prev)msg=`Tu progresses : ${prev}/6 la dernière fois, ${s.score}/6 aujourd'hui ! Encore une série pour gagner le macaron.`;
  else msg="Bel entraînement ! Recommence : chaque série te fait progresser. Il faut 5 bonnes réponses du premier coup pour gagner le macaron.";
  const livret=got&&level===3?`<p class="fb show" style="margin:0">Niveau CM2 réussi : tu peux montrer ce résultat et colorier <b>${view}</b> dans ton Livret de Réussite.</p>`:"";
  const extra=s.extra.length?`<p class="note">Questions retravaillées : <b>${s.eok} / ${s.extra.length}</b> réussies.</p>`:"";
  document.getElementById("zone").innerHTML=`<div class="result">
      ${macaron(level,got||wasEarned)}
      <div class="score">${s.score}/6</div>
      <p class="fb ${got?"good":"try"}" style="margin:0">${msg}</p>${extra}${livret}
      ${chart(r.scores)}
      <div class="row" style="justify-content:center"><button class="btn" id="again">Nouvelle série</button>
      ${got&&level<3?`<button class="btn green" id="up">Passer au niveau ${level+1}</button>`:""}</div></div>`;
  document.getElementById("again").onclick=startSeries;
  const up=document.getElementById("up");if(up)up.onclick=()=>{level++;series=null;renderSkill()};
  document.querySelectorAll(".lvl").forEach(b=>{const L=+b.dataset.l;b.querySelector("svg").outerHTML=macaron(L,earned(view,L))});
  if(got&&!wasEarned)confetti();
}
function chart(scores){const last=scores.slice(-8);
  return `<div style="width:100%;display:flex;flex-direction:column;align-items:center;gap:4px"><p class="note" style="align-self:flex-start">Mes dernières séries</p><div class="chart">${last.map((v,j)=>`<div class="bar ${j===last.length-1?"last":""} ${v>=5?"full":""}"><span>${v}</span><i style="height:${Math.max(6,v*15)}px"></i></div>`).join("")}</div></div>`}

// ---------- vérification ----------
function wire(box,onEnter){
  box.addEventListener("click",e=>{const b=e.target.closest(".sg button,.choices button");if(!b||box.dataset.locked)return;
    const g=b.parentElement;g.querySelectorAll("button").forEach(x=>x.classList.toggle("sel",x===b));g.classList.remove("ok","ko")});
  box.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.matches("input")){e.preventDefault();onEnter()}});
  box.addEventListener("input",e=>{if(e.target.matches("input.dot"))e.target.classList.remove("ok","ko")});
}
const val=i=>i.value.trim().replace(/\s/g,"");
function values(box){const v={};
  box.querySelectorAll("input.dot[data-role]").forEach(i=>{if(i.dataset.role)v[i.dataset.role]=val(i)===""?undefined:+val(i)});
  box.querySelectorAll(".fin[data-role]").forEach(g=>{const[a,b]=g.querySelectorAll("input");v[g.dataset.role]={n:+val(a),d:+val(b)}});
  box.querySelectorAll(".choices[data-role]").forEach(g=>{const s=g.querySelector(".sel");if(s)v[g.dataset.role]=+s.dataset.v});
  return v}
function incomplete(box){return [...box.querySelectorAll("input.dot")].some(i=>val(i)==="")||[...box.querySelectorAll(".sg,.choices")].some(g=>!g.querySelector(".sel"))}
const EMPTY=`<b>Il manque des réponses.</b> Complète toutes les cases avant de vérifier.`;
function mark(el,ok){el.classList.toggle("ok",ok);el.classList.toggle("ko",!ok)}
function check(box){
  let all=true;
  box.querySelectorAll("input.dot[data-ans]").forEach(i=>{const ok=val(i)===i.dataset.ans;mark(i,ok);all=all&&ok});
  box.querySelectorAll(".fin").forEach(g=>{const[a,b]=g.querySelectorAll("input"),n=+val(a),d=+val(b);
    const ok=val(a)!==""&&val(b)!==""&&d>0&&n*(+g.dataset.d)===(+g.dataset.n)*d;mark(a,ok);mark(b,ok);all=all&&ok});
  box.querySelectorAll(".sg,.choices").forEach(g=>{const s=g.querySelector(".sel"),ok=!!s&&s.dataset.v===g.dataset.ans;
    g.classList.toggle("ok",ok);g.classList.toggle("ko",!ok);all=all&&ok});
  return all;
}
function reveal(box){
  box.querySelectorAll("input.dot[data-ans]").forEach(i=>{i.value=i.dataset.ans;mark(i,true)});
  box.querySelectorAll(".fin").forEach(g=>{const[a,b]=g.querySelectorAll("input");a.value=g.dataset.n;b.value=g.dataset.d;mark(a,true);mark(b,true)});
  box.querySelectorAll(".sg,.choices").forEach(g=>{g.querySelectorAll("button").forEach(x=>x.classList.toggle("sel",x.dataset.v===g.dataset.ans));g.classList.remove("ko");g.classList.add("ok")});
  lock(box);
}
function lock(box){box.dataset.locked="1";box.querySelectorAll("input").forEach(i=>i.readOnly=true)}

function stairsSVG(cur){
  const solved=new Set(S.stairs.solved),W=560,H=250,w=50,h=20;
  const cols=["#F2557A","#FF8FAB","#FFB4C6","#FFD166","#FFC14D","#F9A03F","#5DB075","#7CC48D","#5B7BE0","#8DA2EC"];
  const reach=Math.max(firstUnsolved(),...solved,0);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="group" aria-label="Escalier des problèmes"><rect x="0" y="${H-10}" width="${W}" height="10" fill="#F0D6DF"/>`;
  for(let k=0;k<10;k++){const x=20+k*w,y=H-10-(k+1)*h,on=solved.has(k),open=k<=reach;
    s+=`<g class="step" data-k="${k}" tabindex="${open?0:-1}" aria-label="Marche ${k+1}${on?", réussie":""}"><rect x="${x}" y="${y}" width="${w}" height="${(k+1)*h}" fill="${on?cols[k]:open?"#FFF":"#F6EEF1"}" stroke="${k===cur?"#5B7BE0":"#E0C8D2"}" stroke-width="${k===cur?4:2}"/>
      <text x="${x+w/2}" y="${y+16}" text-anchor="middle" font-family="Baloo 2,sans-serif" font-weight="800" font-size="15" fill="${on?"#fff":"#B79AA8"}">${k+1}</text></g>`;}
  const ck=Math.min(cur,9),cx=20+ck*w+w/2-17,cy=H-10-(ck+1)*h-36;
  s+=`<g transform="translate(${cx} ${cy}) scale(.36)">${chef().replace('<svg class="chef" viewBox="0 0 100 100" aria-hidden="true">',"").replace("</svg>","")}</g>`;
  return s+`</svg>`;
}

      <div class="row"><button class="btn green" id="chk">Vérifier</button><button class="btn" id="nxt" hidden>Marche suivante</button><button class="btn soft" id="other" hidden>Un autre problème</button></div>
    </div></section>`;
  $main.querySelectorAll("g.step").forEach(g=>{const go2=()=>{if(g.getAttribute("tabindex")==="0"){hush();curStep=+g.dataset.k;renderStairs()}};
    g.addEventListener("click",go2);g.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go2()}})});
  const box=document.getElementById("qbox");initManips(box);
  document.querySelector(".listen").onclick=()=>speak(box);
  const pb=document.getElementById("pouceBtn");if(pb)pb.onclick=()=>{document.getElementById("pouce").hidden=false;pb.hidden=true};
  let tries=0,done=false;
  const doCheck=()=>{if(done)return;const fb=document.getElementById("fb");fb.hidden=false;
    if(p.manip){const m=box.querySelector(".manip");if(m&&!m.done()){fb.className="fb try";fb.innerHTML=`<b>Commence par manipuler !</b> ${m.querySelector(".mtip").textContent}`;return}}
    if(incomplete(box)){fb.className="fb try";fb.innerHTML=EMPTY;return}
    const ok=check(box);tries++;
    if(ok){done=true;lock(box);fb.className="fb good";fb.innerHTML=`<b>Bravo, tu montes d'une marche !</b> ${p.explain}`;
      if(!S.stairs.solved.includes(curStep)){S.stairs.solved.push(curStep);save();if(S.stairs.solved.length===10)confetti()}
      document.getElementById("chk").hidden=true;const n=document.getElementById("nxt");
      if(curStep<9){n.hidden=false;n.onclick=()=>{hush();curStep++;renderStairs()}}
      $main.querySelector(".stairs").innerHTML=stairsSVG(Math.min(curStep+1,9));}
    else{const d=p.diag?p.diag(values(box)):null;
      fb.className="fb try";fb.innerHTML=`<b>${tries===1?"Pas encore !":"Courage, tu restes sur ta marche !"}</b> Regarde les cases en rouge. ${d?`<span class="why">${d}</span>`:`Petite aide : ${p.hint}`}`+(tries>=3?` <button class="btn small soft" id="sol">Voir la solution</button>`:"");
      const sb=document.getElementById("sol");if(sb)sb.onclick=()=>{done=true;reveal(box);fb.className="fb show";
        fb.innerHTML=`<b>Voici la solution :</b> ${p.explain} Relis-la, puis essaie un autre problème du même type pour monter la marche.`;
        document.getElementById("chk").hidden=true;const o=document.getElementById("other");o.hidden=false;o.onclick=()=>{hush();renderStairs()}}}};
  wire(box,doCheck);document.getElementById("chk").onclick=doCheck;
}

// ---------- confettis ----------
function confetti(){
  if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const cv=document.getElementById("confetti");let ctx;try{ctx=cv.getContext("2d")}catch(e){return}if(!ctx)return;
  cv.hidden=false;cv.width=innerWidth;cv.height=innerHeight;
  const cols=["#F2557A","#FFD166","#5DB075","#5B7BE0","#B48CE0","#7B4A2E"];
  const P=Array.from({length:120},()=>({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.5,vx:(Math.random()-.5)*3,vy:2+Math.random()*3,c:pick(cols),a:Math.random()*6,r:Math.random()<.5}));
  let t=0;(function f(){ctx.clearRect(0,0,cv.width,cv.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.a+=.1;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillStyle=p.c;
    if(p.r){ctx.beginPath();ctx.arc(0,0,5,0,7);ctx.fill()}else ctx.fillRect(-5,-3,10,6);ctx.restore()});
    if(++t<200)requestAnimationFrame(f);else{ctx.clearRect(0,0,cv.width,cv.height);cv.hidden=true}})();
}

go("home");
